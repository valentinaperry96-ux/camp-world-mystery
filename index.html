}

/* ================= TASKS / ROW ================= */
function refillDeck(){ deck = shuffle(CONFIG.TASKS.map((_, i) => i).filter(i => i !== lastQ)); }
function nextTask(){
  if (!deck.length) refillDeck();
  const qi = deck.pop(); lastQ = qi;
  const t = CONFIG.TASKS[qi];
  const opts = shuffle([t[1], t[2], t[3]]);
  task = { q: t[0], options: opts, correct: opts.indexOf(t[1]) };
  plaqueEl.textContent = task.q;
  row.forEach((p, i) => {
    if (p){
      p.body.querySelector(".platform-label").textContent = task.options[i];
      p.body.querySelector(".key-hint").textContent = i + 1;
      p.body.classList.remove("ok", "selected");
    }
  });
  selected = 1; markSelected();
}
function spawnRow(){
  row = [-1, 0, 1].map(c => makePlatform(current.wx + c * spread, current.wy - ROW_GAP, c + 1, ""));
}
function markSelected(){
  row.forEach((p, i) => p && p.body.classList.toggle("selected", i === selected && p.alive));
}
function aliveSlots(){ return row.map((p, i) => (p && p.alive) ? i : -1).filter(i => i >= 0); }

/* ================= GAME FLOW ================= */
function choose(i){
  if (state.screen !== "play" || busy) return;
  const p = row[i];
  if (!p || !p.alive) return;
  busy = true; selected = i; markSelected();
  sJump();
  startJump({ x: hero.wx, y: hero.wy }, stand(p), 700, 110, () => land(i));
}
function land(i){
  const p = row[i];
  if (task && i === task.correct){
    state.combo++;
    const gain = 10 + (state.combo - 1) * 5;
    state.score += gain; state.words++;
    p.body.classList.add("ok");
    confetti(); popup(p, "+" + gain);
    showFeedback("✅ " + task.options[i] + "!");
    sOk(); updateHud();
    const old = current;
    current = p; p.slot = -1;
    p.body.querySelector(".key-hint").style.display = "none";
    row.forEach((q, j) => { if (q && q !== p) fall(q); });
    if (old) fall(old);
    row = [null, null, null];
    setTimeout(() => {
      feedbackEl.hidden = true;
      if (CONFIG.WIN_WORDS > 0 && state.words >= CONFIG.WIN_WORDS) return end(true);
      spawnRow();
      nextTask();
      busy = false;
    }, 700);
  } else {
    state.combo = 0; state.hearts--;
    crackFall(p);
    if (task && row[task.correct]) row[task.correct].body.classList.add("ok");
    showFeedback("❌ Correct: " + (task ? task.options[task.correct] : ""));
    sBad(); updateHud();
    startJump({ x: hero.wx, y: hero.wy }, stand(current), 600, 90, () => {
      feedbackEl.hidden = true;
      if (state.hearts <= 0) return end(false);
      busy = false;
    });
  }
}
function start(){
  state.screen = "play";
  state.hearts = CONFIG.HEARTS; state.score = 0; state.combo = 0; state.words = 0;
  deck = []; lastQ = -1; busy = false;
  allPlats.forEach(p => p.el.remove()); allPlats = [];
  computeMetrics();
  current = makePlatform(0, 0, -1, "");
  cam.x = current.wx; cam.y = current.wy - H * 0.12;
  hero.wx = stand(current).x; hero.wy = stand(current).y;
  menuEl.hidden = true; endEl.hidden = true; hudEl.hidden = false; feedbackEl.hidden = true;
  topicEl.textContent = CONFIG.TOPIC;
  spawnRow();
  nextTask();
  updateHud();
}
function end(win){
  state.screen = "end";
  hudEl.hidden = true;
  if (win) sWin();
  if (state.score > state.best){ state.best = state.score; saveBest(); }
  $("#end-title").textContent = win ? "🏆 You win!" : "Game over!";
  $("#end-text").textContent = win
    ? "You solved " + CONFIG.WIN_WORDS + " words — amazing!"
    : "The mystery continues...";
  $("#end-stats").textContent = state.score + " points • " + state.best + " best • " + state.words + " words solved";
  endEl.hidden = false;
  if (win){ try{ window.parent.postMessage({type:"minigame-won", id:"verbjump"}, "*"); }catch(e){} }
}

/* ================= EVENTS ================= */
$("#btn-start").addEventListener("click", start);
$("#btn-again").addEventListener("click", start);
$("#btn-sound").addEventListener("click", () => {
  muted = !muted;
  $("#btn-sound").textContent = muted ? "🔇" : "🔊";
});
document.addEventListener("keydown", e => {
  if (state.screen !== "play") return;
  if (e.key >= "1" && e.key <= "3") choose(+e.key - 1);
  else if (e.key === "ArrowRight" || e.key === "ArrowLeft"){
    const alive = aliveSlots();
    if (alive.length){
      let idx = alive.indexOf(selected);
      idx = e.key === "ArrowRight" ? (idx + 1) % alive.length : (idx - 1 + alive.length) % alive.length;
      selected = alive[idx]; markSelected();
    }
    e.preventDefault();
  }
  else if (e.code === "Space"){ choose(selected); e.preventDefault(); }
});
window.addEventListener("resize", () => { computeMetrics(); });

/* ================= INIT ================= */
loadBest();
computeMetrics();
applySkins();
requestAnimationFrame(loop);
<\/script>
</body>
</html>`;

/* ================= Listen for mini-game win signals ================= */
window.addEventListener("message", function(ev){
  const data = ev.data;
  if (!data || typeof data !== "object") return;
  if (data.type !== "minigame-won") return;
  if (!gameState.miniGameOpen || !gameState.activeMiniGameId) return;
  const mg = GAME_DATA.miniGames[gameState.activeMiniGameId];
  if (!mg) return;
  if (data.id && data.id !== mg.type) return;
  if (gameState.miniGameCompleted[mg.id]) return;
  miniGameSuccess(mg);
});

function miniGameSuccess(mg){
  gameState.miniGameCompleted[mg.id] = true;
  addClue(mg.rewardClueId);
  const clue = getClue(mg.rewardClueId);
  const container = $("#minigame-container");
  container.innerHTML = `
    <div class="minigame">
      <p><strong>${GAME_DATA.ui.greatJob}</strong></p>
      <p>${clue.description}</p>
      <button type="button" class="btn btn-ghost" data-action="toggle-minigame">${GAME_DATA.ui.closeMiniGame}</button>
    </div>`;
  announce(GAME_DATA.ui.greatJob);
}

/* ================= NOTEBOOK ================= */
function openNotebook(){ renderNotebook(); $("#overlay-notebook").hidden = false; $("#btn-close-notebook").focus(); }
function closeNotebook(){ $("#overlay-notebook").hidden = true; }

/* ================= HELP ================= */
function openHelp(){ renderHelp(); $("#overlay-help").hidden = false; $("#btn-close-help").focus(); }
function closeHelp(){ $("#overlay-help").hidden = true; }
function renderHelp(){
  const box = $("#help-text"); box.innerHTML = "";
  GAME_DATA.startScreen.text.split("\n").forEach(line => {
    const p = document.createElement("p"); p.textContent = line; box.appendChild(p);
  });
}

function addNote(text){
  if (gameState.notebookEntries.some(e => e.text === text)) return;
  gameState.notebookEntries.push({ id: Date.now() + Math.random(), text });
  if (!$("#overlay-notebook").hidden) renderNotebook();
}

function addClue(clueId){
  if (hasClue(clueId)) return;
  const clue = getClue(clueId);
  gameState.collectedClues.push(clueId);
  addNote("New clue: " + clue.name + ".");
  showNotification(clue.name + " added to the Notebook.");
  updateFinalUnlock();
  if (!$("#overlay-notebook").hidden) renderNotebook();
}

function updateFinalUnlock(){
  const all = GAME_DATA.final.requiredKeyClues.every(hasClue);
  if (all && !gameState.finalUnlocked){
    gameState.finalUnlocked = true;
    if (!gameState.finalNoteAdded){ addNote(GAME_DATA.ui.keyCluesMessage); gameState.finalNoteAdded = true; }
    showNotification(GAME_DATA.ui.keyCluesMessage);
  }
  if (gameState.currentScreen === "map") renderMap();
}

function renderNotebook(){
  document.querySelector(".notebook-panel").style.backgroundImage = "url('" + GAME_DATA.notebook.background + "')";
  $("#notebook-progress").textContent = GAME_DATA.ui.keyProgress + ": " + getKeyClueCount() + "/" + GAME_DATA.final.requiredKeyClues.length;

  const cluesBox = $("#notebook-clues"), notesBox = $("#notebook-notes");
  cluesBox.innerHTML = ""; notesBox.innerHTML = "";

  if (gameState.collectedClues.length === 0){
    cluesBox.innerHTML = "<p>" + GAME_DATA.ui.noClues + "</p>";
  } else {
    gameState.collectedClues.forEach(id => {
      const c = getClue(id);
      const card = document.createElement("article");
      card.className = "clue-card" + (c.keyClue ? " clue-card--key" : "");
      card.innerHTML = `<img class="clue-icon-img" src="${c.image}" alt="">
        <div><h3>${c.name}${c.keyClue ? " ⭐" : ""}</h3><p>${c.description}</p></div>`;
      cluesBox.appendChild(card);
    });
  }

  if (gameState.notebookEntries.length === 0){
    notesBox.innerHTML = "<p>" + GAME_DATA.ui.noNotes + "</p>";
  } else {
    gameState.notebookEntries.forEach(e => {
      const n = document.createElement("div");
      n.className = "note-entry"; n.textContent = e.text;
      notesBox.appendChild(n);
    });
  }
}

/* ================= FINAL ================= */
function openFinalScreen(){
  if (!gameState.finalUnlocked || gameState.gameCompleted) return;
  gameState.selectedSuspect = null;
  renderFinalScreen();
  showScreen("final");
}

function renderFinalScreen(){
  $("#final-question").textContent = GAME_DATA.ui.accusationQuestion;
  $("#btn-confirm-accusation").textContent = GAME_DATA.ui.accuse;
  $("#btn-final-return").textContent = GAME_DATA.ui.returnToMap;
  $("#final-message").textContent = ""; $("#final-message").className = "final-message";
  $("#final-hint").hidden = true;
  renderFinalOptions();
}

function renderFinalOptions(){
  const box = $("#final-options"); box.innerHTML = "";
  GAME_DATA.characters.forEach(ch => {
    const sel = gameState.selectedSuspect === ch.id;
    const b = document.createElement("button");
    b.type = "button";
    b.className = "btn suspect-option" + (sel ? " suspect-option--selected" : "");
    b.dataset.action = "select-suspect"; b.dataset.character = ch.id;
    b.textContent = ch.name;
    box.appendChild(b);
  });
}

function selectSuspect(id){
  gameState.selectedSuspect = id;
  $("#final-message").textContent = ""; $("#final-message").className = "final-message";
  $("#final-hint").hidden = true;
  renderFinalOptions();
}

function confirmAccusation(){
  const m = $("#final-message"), h = $("#final-hint");
  if (!gameState.finalUnlocked){ m.textContent = GAME_DATA.ui.lockedFinal; m.className = "final-message final-message--locked"; return; }
  if (!gameState.selectedSuspect){ m.textContent = GAME_DATA.ui.selectCharacter; m.className = "final-message final-message--locked"; return; }

  if (gameState.selectedSuspect === GAME_DATA.final.culpritId){
    gameState.gameCompleted = true;
    gameState.accusedCharacter = gameState.selectedSuspect;
    showVictoryScreen();
  } else {
    gameState.accusedCharacter = gameState.selectedSuspect;
    m.textContent = GAME_DATA.ui.wrong; m.className = "final-message final-message--error";
    h.textContent = GAME_DATA.ui.hint; h.hidden = false;
  }
}

function showVictoryScreen(){
  $("#victory-title").textContent = GAME_DATA.ui.correct;
  $("#victory-image").src = GAME_DATA.final.victoryImage;
  $("#victory-text").textContent = GAME_DATA.ui.victory;
  $("#victory-explanation").textContent = GAME_DATA.ui.finalExplanation;
  $("#btn-victory-return").textContent = GAME_DATA.ui.returnToMap;
  showScreen("victory");
}

/* ================= STATIC / EVENTS ================= */
function renderStaticLabels(){
  $("#btn-open-notebook-map").textContent = GAME_DATA.ui.openNotebook;
  $("#btn-open-notebook-location").textContent = GAME_DATA.ui.openNotebook;
  $("#btn-open-help-map").textContent = "❓ Help";
  $("#btn-open-help-location").textContent = "❓ Help";
  $("#btn-close-help").textContent = "Close Help";
  $("#btn-return-map").textContent = GAME_DATA.ui.returnToMap;
  $("#btn-final-return").textContent = GAME_DATA.ui.returnToMap;
  $("#btn-victory-return").textContent = GAME_DATA.ui.returnToMap;
  $("#btn-close-notebook").textContent = GAME_DATA.ui.closeNotebook;
  $("#notebook-title").textContent = GAME_DATA.ui.notebookTitle;
  $("#notebook-clues-title").textContent = GAME_DATA.ui.cluesTitle;
  $("#notebook-notes-title").textContent = GAME_DATA.ui.notesTitle;
  $("#btn-minigame-toggle").textContent = GAME_DATA.ui.openMiniGame;
}

function handleAction(e){
  const el = e.target.closest("[data-action]");
  if (!el) return;
  switch (el.dataset.action){
    case "start": startGame(); break;
    case "go-map": goToMap(); break;
    case "open-location": openLocation(el.dataset.location); break;
    case "open-notebook": openNotebook(); break;
    case "close-notebook": closeNotebook(); break;
    case "open-help": openHelp(); break;
    case "close-help": closeHelp(); break;
    case "ask": askQuestion(el.dataset.index); break;
    case "toggle-minigame": toggleMiniGame(); break;
    case "open-final": openFinalScreen(); break;
    case "select-suspect": selectSuspect(el.dataset.character); break;
    case "confirm-accusation": confirmAccusation(); break;
  }
}

function bindEvents(){
  document.addEventListener("click", handleAction);
  document.addEventListener("keydown", e => {
    if (e.key === "Enter" && e.target.classList.contains("q-input")){
      askQuestion(e.target.dataset.index);
    }
    if (e.key === "Escape" && !$("#overlay-notebook").hidden) closeNotebook();
    if (e.key === "Escape" && !$("#overlay-help").hidden) closeHelp();
  });
  $("#overlay-notebook").addEventListener("click", e => {
    if (e.target === $("#overlay-notebook")) closeNotebook();
  });
  $("#overlay-help").addEventListener("click", e => {
    if (e.target === $("#overlay-help")) closeHelp();
  });
}

function initGame(){
  renderStaticLabels();
  renderStart();
  bindEvents();
  showScreen("start");
}

document.addEventListener("DOMContentLoaded", initGame);
</script>
