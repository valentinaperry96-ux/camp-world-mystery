<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Camp World Mystery: The Missing Red Notebook</title>
<style>
  :root{
    --deep:#5B4BC4; --peri:#8F7BEB; --lav:#B9A7F2; --ink:#33268F;
    --pink:#F7A8D8; --pink-deep:#E46BB4; --ice:#BFE6F7; --ice-deep:#7FB6E8;
    --lime:#8FD14F; --lime-deep:#4E9A1F; --red:#E5484D; --gold:#FFD34D;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; overflow:hidden; color:var(--ink);
    font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;
    background:linear-gradient(180deg,#B79CFF 0%,#EFD3F7 45%,#8F7BEB 100%);
  }
  body::before{
    content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
    background:
      radial-gradient(2px 2px at 15% 25%,#fff 50%,transparent 55%),
      radial-gradient(2px 2px at 80% 15%,#fff 50%,transparent 55%),
      radial-gradient(3px 3px at 65% 70%,#FFE3F7 50%,transparent 55%),
      radial-gradient(2px 2px at 30% 80%,#fff 50%,transparent 55%),
      radial-gradient(2px 2px at 90% 60%,#fff 50%,transparent 55%),
      repeating-linear-gradient(0deg,rgba(255,255,255,.12) 0 1px,transparent 1px 70px),
      repeating-linear-gradient(90deg,rgba(255,255,255,.12) 0 1px,transparent 1px 70px);
  }
  [hidden]{display:none !important;}
  .visually-hidden{position:absolute;width:1px;height:1px;margin:-1px;clip-path:inset(50%);overflow:hidden;white-space:nowrap;}

  #app{height:100dvh;}
  .screen{height:100%; max-width:1200px; margin:0 auto; padding:12px; display:flex; flex-direction:column; min-height:0;}

  .glass{
    background:linear-gradient(180deg,rgba(255,255,255,.95),rgba(233,219,255,.9));
    border:3px solid var(--deep); border-radius:22px;
    box-shadow:inset 0 0 0 3px #fff, inset 0 4px 12px rgba(255,255,255,.9), 0 10px 26px rgba(91,75,196,.4);
  }

  h1,h2,h3{margin:0; line-height:1.15;}
  .title-y2k{
    background:linear-gradient(180deg,#fff 0%,#FFD9F0 35%,#B9A7F2 70%,#8F7BEB 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    -webkit-text-stroke:1.5px var(--deep);
    filter:drop-shadow(0 2px 0 rgba(255,255,255,.75)) drop-shadow(0 5px 10px rgba(143,123,235,.45));
    font-weight:900; letter-spacing:.5px;
  }

  .btn{
    min-height:44px; padding:10px 18px; border-radius:999px; cursor:pointer;
    border:2px solid var(--deep); font:inherit; font-weight:800; color:var(--ink);
    text-transform:uppercase; letter-spacing:.05em;
    background:linear-gradient(180deg,#fff 0%,#E4D6FF 40%,#A98BFF 100%);
    box-shadow:inset 0 2px 3px #fff, inset 0 -3px 6px rgba(91,75,196,.3), 0 3px 0 var(--deep), 0 7px 14px rgba(91,75,196,.35);
    transition:transform .15s ease;
  }
  .btn:hover:not(:disabled){transform:translateY(-2px) scale(1.02);}
  .btn:disabled{opacity:.55; cursor:not-allowed;}
  .btn-lime{
    color:#2C6B12; border-color:var(--lime-deep);
    background:linear-gradient(180deg,#fff 0%,#E4FFB0 40%,#8FD14F 100%);
    box-shadow:inset 0 2px 3px #fff, inset 0 -3px 6px rgba(78,154,31,.3), 0 3px 0 var(--lime-deep), 0 7px 14px rgba(90,170,40,.35);
  }
  .btn-candy{
    color:#8C1D54; border-color:var(--pink-deep);
    background:linear-gradient(180deg,#fff 0%,#FFD9F0 40%,#FF8CC6 100%);
    box-shadow:inset 0 2px 3px #fff, inset 0 -3px 6px rgba(228,107,180,.3), 0 3px 0 var(--pink-deep), 0 7px 14px rgba(255,122,184,.4);
  }
  .btn-ghost{
    color:#1D5E8C; border-color:var(--ice-deep);
    background:linear-gradient(180deg,rgba(255,255,255,.9),rgba(191,230,247,.75));
    box-shadow:inset 0 2px 3px #fff, 0 3px 0 var(--ice-deep), 0 6px 12px rgba(127,182,232,.35);
  }
  .btn-big{min-height:54px; padding:12px 42px; font-size:1.15rem;}
  .btn:focus-visible,input:focus-visible,select:focus-visible,.map-location:focus-visible{outline:4px solid var(--pink); outline-offset:2px;}

  .topbar{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:10px;}
  .topbar h1{flex:1; min-width:140px; font-size:clamp(1.05rem,2.6vw,1.5rem);}

  /* ============ START HERO ============ */
  #screen-start{align-items:center; justify-content:center;}
  .start-hero{position:relative; width:min(880px,100%); flex:1; min-height:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; padding:8px;}
  .hero-deco{position:absolute; inset:0; pointer-events:none; overflow:hidden;}
  .orb{position:absolute; border-radius:50%;
    background:radial-gradient(circle at 30% 25%, rgba(255,255,255,.95), rgba(255,255,255,.25) 45%, rgba(185,167,242,.15) 70%);
    box-shadow:0 0 18px rgba(255,255,255,.6), inset 0 0 12px rgba(255,255,255,.8);
    animation:float 7s ease-in-out infinite;}
  .orb-1{width:70px;height:70px; left:5%; top:10%;}
  .orb-2{width:44px;height:44px; right:9%; top:20%; animation-delay:1.2s;}
  .orb-3{width:28px;height:28px; left:14%; bottom:16%; animation-delay:2s;}
  .ring{position:absolute; right:5%; bottom:7%; width:110px; height:110px; border-radius:50%;
    border:10px solid rgba(255,255,255,.85);
    box-shadow:0 0 22px rgba(143,123,235,.7), inset 0 0 14px rgba(185,167,242,.8);
    animation:float 9s ease-in-out infinite;}
  .spark{position:absolute; color:#fff; text-shadow:0 0 10px #FFD9F0, 0 0 20px #8F7BEB; animation:twinkle 2.6s ease-in-out infinite;}
  .s-1{left:11%; top:7%; font-size:22px;}
  .s-2{right:15%; top:9%; font-size:16px; animation-delay:.7s;}
  .s-3{left:8%; bottom:24%; font-size:18px; animation-delay:1.4s;}
  .s-4{right:10%; bottom:28%; font-size:26px; animation-delay:2s;}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
  @keyframes twinkle{0%,100%{opacity:.25; transform:scale(.8)}50%{opacity:1; transform:scale(1.15)}}

  .hero-title{
    margin:0; text-align:center; text-transform:uppercase;
    font-size:clamp(1.8rem,5.2vw,3.6rem); font-weight:900; letter-spacing:.04em;
    background:linear-gradient(100deg,#fff 0%,#FFD9F0 20%,#B9A7F2 40%,#8FE8F0 60%,#FFD9F0 80%,#fff 100%);
    background-size:220% 100%;
    -webkit-background-clip:text; background-clip:text; color:transparent;
    -webkit-text-stroke:1.5px var(--deep);
    filter:drop-shadow(0 2px 0 #fff) drop-shadow(0 6px 14px rgba(91,75,196,.55));
    animation:holo 7s linear infinite;
  }
  @keyframes holo{0%{background-position:0% 50%}100%{background-position:220% 50%}}

  .hero-sub{margin:0; font-weight:800; color:var(--deep);
    background:rgba(255,255,255,.75); padding:6px 16px; border-radius:999px;
    border:2px solid var(--peri); box-shadow:inset 0 0 0 2px #fff;}

  /* РАМКА: картинка помещается ПОЛНОСТЬЮ, рамка обнимает её */
  .hero-frame{position:relative; width:min(100%, 780px); margin:0 auto; border-radius:26px; border:4px solid #fff; outline:3px solid var(--deep);
    overflow:hidden; box-shadow:0 14px 34px rgba(91,75,196,.5), inset 0 0 0 2px rgba(255,255,255,.8);
    display:flex; align-items:center; justify-content:center;
    background:linear-gradient(180deg,rgba(255,255,255,.35),rgba(185,167,242,.25));}
  .hero-frame img{display:block; max-width:100%; width:auto; height:auto; max-height:46vh; object-fit:contain;}
  .hero-frame::after{content:""; position:absolute; inset:0;
    background:linear-gradient(115deg, transparent 35%, rgba(255,255,255,.55) 50%, transparent 65%);
    transform:translateX(-120%); animation:shine 4.5s ease-in-out infinite;}
  @keyframes shine{0%{transform:translateX(-120%)}55%,100%{transform:translateX(120%)}}

  .start-text{width:min(780px,100%); padding:10px 20px; text-align:center;
    background:rgba(255,255,255,.82); border:2px dashed var(--peri); border-radius:18px;
    columns:2; column-gap:26px;}
  .start-text p{margin:4px 0; font-weight:700; font-size:.95rem; break-inside:avoid;}

  /* ============ MAP ============ */
  .map-status{padding:8px 14px; border-radius:999px; font-weight:800; margin-bottom:10px;
    background:rgba(255,255,255,.9); border:2px solid var(--deep);
    box-shadow:inset 0 0 0 2px #fff, 0 3px 0 rgba(91,75,196,.35);}
  .map-wrap{position:relative; flex:1; min-height:0;}
  .map-board{position:absolute; inset:0; border-radius:24px; overflow:hidden;
    border:3px solid var(--deep); background-color:#CBB8F5; background-size:cover; background-position:center;
    box-shadow:inset 0 0 0 3px #fff, 0 12px 30px rgba(91,75,196,.45);}
  .map-location{position:absolute; transform:translate(-50%,-50%); width:26%;
    min-height:64px; padding:8px 10px; border-radius:999px; cursor:pointer;
    border:3px solid var(--deep); font:inherit; font-weight:800; color:var(--ink);
    background:linear-gradient(180deg,rgba(255,255,255,.95),rgba(247,168,216,.85));
    box-shadow:inset 0 0 0 2px #fff, 0 4px 0 var(--deep), 0 8px 16px rgba(91,75,196,.35);
    display:grid; gap:2px; justify-items:center;}
  .map-location--visited{background:linear-gradient(180deg,#fff,#BDEBFF);}
  .map-location--completed{background:linear-gradient(180deg,#F2FFD1,#B8EC74);}
  .map-status-label{font-size:.75rem; font-weight:700; opacity:.8;}
  #btn-final{position:absolute; left:50%; top:47%; transform:translate(-50%,-50%); width:30%; margin:0;}

  /* ============ LOCATION ============ */
  .scene-banner{position:relative; height:37vh; min-height:215px; margin-bottom:10px; flex:none;
    border-radius:24px; overflow:hidden; border:3px solid var(--deep);
    background-size:cover; background-position:center;
    box-shadow:inset 0 0 0 3px #fff, 0 12px 26px rgba(91,75,196,.4);
    margin-bottom:10px;}
  .character-portrait{position:absolute; top:12px; left:12px; width:84px; height:84px; object-fit:cover;
    border-radius:50%; border:4px solid #fff; background:#fff;
    box-shadow:0 0 0 3px var(--deep), 0 8px 18px rgba(51,38,143,.5);}
  .character-card{position:absolute; left:12px; bottom:12px; padding:8px 16px; text-align:left;}
  .character-card h2{font-size:1rem;}
  .character-card p{margin:2px 0 0; font-size:.82rem; font-weight:600;}

  .right-panel{flex:1; min-height:0; display:flex; flex-direction:column; padding:12px; overflow:hidden;}
  #dialogue-body{min-height:0;}
  .right-head{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:8px;}
  .bubble{padding:8px 14px; border-radius:18px 18px 18px 6px; min-height:46px; margin-bottom:8px;
    background:linear-gradient(180deg,#fff,#F3E8FF); border:3px solid var(--peri);
    box-shadow:0 4px 0 rgba(91,75,196,.3); font-weight:700;}
  .questions-list{display:grid; gap:6px;}
  .q-row{display:grid; grid-template-columns:200px 1fr 84px; gap:8px; align-items:center;}
  .q-hint{white-space:normal; text-align:center; line-height:1.15;}
  .chip{padding:6px 12px; border-radius:999px; font-weight:800; font-size:.82rem; white-space:nowrap;
    background:#fff; border:2px dashed var(--peri); color:var(--deep); box-shadow:0 2px 0 rgba(91,75,196,.2);}
  .q-input{min-height:44px; width:100%; padding:8px 16px; border-radius:999px;
    border:2px solid var(--peri); background:rgba(255,255,255,.95);
    font:inherit; font-weight:600; color:var(--ink); box-shadow:inset 0 2px 6px rgba(143,123,235,.3);}
  .q-input:disabled{background:#EAFBE0; border-color:var(--lime-deep);}
  .q-ask{min-width:74px;}
  .dialogue-feedback{min-height:22px; margin-top:8px; font-weight:800;}
  .dialogue-feedback--error{color:var(--red);}

  .minigame-container{flex:1; min-height:0; overflow:auto; display:flex; flex-direction:column;}
  .minigame{padding:10px; border-radius:18px;
    background:rgba(191,230,247,.5); backdrop-filter:blur(6px);
    border:3px solid var(--ice-deep); box-shadow:inset 0 0 0 2px #fff;}
  .minigame h3{font-size:1rem; margin-bottom:6px;}
  .minigame__help{margin:4px 0; font-size:.85rem; font-weight:600; opacity:.8;}
  .minigame__actions{display:flex; gap:8px; flex-wrap:wrap; margin-top:8px;}
  .minigame__feedback{min-height:24px; margin-top:6px; font-weight:800;}
  .minigame__feedback--success{color:#24773B;}
  .minigame__feedback--error{color:var(--red);}

  /* ============ EMBEDDED MINI-GAMES IFRAME ============ */
  .mg-frame-wrap{position:relative; width:100%; height:min(80vh, 760px); min-height:540px;
    border-radius:18px; overflow:hidden; border:3px solid var(--deep); margin-top:6px;
    box-shadow:inset 0 0 0 2px #fff, 0 10px 22px rgba(91,75,196,.4);
    background:linear-gradient(180deg,#B79CFF 0%,#EFD3F7 45%,#8F7BEB 100%);}
  .mg-frame-wrap iframe{width:100%; height:100%; border:none; display:block;}

  /* Notebook */
  .overlay{position:fixed; inset:0; z-index:60; display:flex; align-items:center; justify-content:center;
    padding:14px; background:rgba(51,38,143,.5); backdrop-filter:blur(4px);}
  .notebook-panel{width:min(760px,100%); max-height:92dvh; overflow:auto; padding:16px;
    background-size:100% 100%; background-color:rgba(243,232,255,.95);}
  .clue-card{display:grid; grid-template-columns:auto 1fr; gap:10px; align-items:center; padding:8px; margin-bottom:8px;
    background:#fff; border:2px solid var(--peri); border-radius:16px;}
  .clue-card--key{border-color:var(--gold); box-shadow:0 0 0 3px rgba(255,211,77,.45);}
  .clue-icon-img{width:52px; height:52px; object-fit:cover; border-radius:12px; border:2px solid #fff;
    box-shadow:0 0 0 2px var(--deep), 0 4px 10px rgba(91,75,196,.35);}
  .note-entry{padding:8px 10px; margin-bottom:8px; background:#fff; border:2px dashed var(--peri); border-radius:12px; font-weight:600;}

  /* Help overlay */
  .help-panel{width:min(560px,100%); max-height:92dvh; overflow:auto; padding:18px 22px;}
  .help-text{margin-top:10px;}
  .help-text p{margin:6px 0; font-weight:700; background:#fff;
    border:2px dashed var(--peri); border-radius:12px; padding:6px 12px;}

  /* Final / victory */
  .center-card{width:min(760px,100%); margin:auto; padding:16px; max-height:100%; overflow:auto;}
  .final-options{display:grid; gap:8px; margin:12px 0;}
  .suspect-option{text-align:left;}
  .suspect-option--selected{background:linear-gradient(180deg,#FFE3F1,#FFA8D2);}
  .final-message{min-height:26px; font-weight:800;}
  .final-message--error{color:var(--red);}
  .final-message--locked{color:var(--deep);}
  .final-hint{margin-top:8px; padding:10px; border-radius:14px; background:#FFF6D8; border:2px solid var(--gold); font-weight:700;}
  .victory-panel img{display:block; width:100%; height:auto; max-height:56vh; object-fit:contain;
    border-radius:16px; border:3px solid #fff; box-shadow:0 0 0 3px var(--deep);
    background:rgba(255,255,255,.4);}

  .global-notification{position:fixed; left:50%; bottom:14px; transform:translateX(-50%); z-index:100;
    max-width:92%; padding:10px 18px; border-radius:999px;
    background:linear-gradient(180deg,#FF8CC6,#8F7BEB); color:#fff; font-weight:800;
    border:2px solid #fff; box-shadow:0 6px 16px rgba(91,75,196,.5);}

  #notebook-progress,
  .notebook-panel h3,
  #notebook-clues > p,
  #notebook-notes > p{
    background:#fff;
    border:2px dashed var(--peri);
    border-radius:12px;
    padding:6px 12px;
    margin:6px 0;
    font-weight:800;
  }

  .loc--minigame .scene-banner{height:12vh; min-height:90px;}
  .loc--minigame .character-portrait{width:56px; height:56px;}
  .loc--minigame .character-card{padding:6px 12px;}
  .loc--minigame .minigame{padding:8px;}
  .loc--minigame .mg-frame-wrap{height:min(84vh, 800px); min-height:580px;}
  @media (max-width:820px){
    .start-text{columns:1;}
    .scene-banner{height:30vh; min-height:180px;}
    .character-portrait{width:64px; height:64px;}
    .map-location{width:34%;}
    #btn-final{width:44%;}
    .q-row{grid-template-columns:1fr auto;}
    .q-hint{grid-column:1 / -1; justify-self:start;}
  }
  @media (max-height:640px){
    .hero-sub{display:none;}
    .scene-banner{height:18vh; min-height:120px;}
    .bubble{min-height:40px;}
    .hero-frame img{max-height:34vh;}
    .mg-frame-wrap{height:min(72vh, 600px); min-height:480px;}
  }
</style>
</head>
<body>
<noscript>Please enable JavaScript to play this game.</noscript>

<main id="app">
  <section id="screen-start" class="screen" hidden>
    <div class="start-hero">
      <div class="hero-deco" aria-hidden="true">
        <span class="orb orb-1"></span><span class="orb orb-2"></span><span class="orb orb-3"></span>
        <span class="ring"></span>
        <span class="spark s-1">✦</span><span class="spark s-2">✧</span>
        <span class="spark s-3">✦</span><span class="spark s-4">✧</span>
      </div>
      <h1 id="start-title" class="hero-title"></h1>
      <p class="hero-sub">🕵️✨ A holographic detective quest for English learners</p>
      <div class="hero-frame"><img id="start-image" alt="Camp World"></div>
      <div id="start-text" class="start-text"></div>
      <button id="btn-start" type="button" class="btn btn-candy btn-big" data-action="start"></button>
    </div>
  </section>

  <section id="screen-map" class="screen" hidden>
    <div class="topbar">
      <h1 class="title-y2k">✨ Camp World Map</h1>
      <button id="btn-open-help-map" type="button" class="btn btn-ghost" data-action="open-help"></button>
      <button id="btn-open-notebook-map" type="button" class="btn btn-ghost" data-action="open-notebook"></button>
    </div>
    <div id="map-status" class="map-status" aria-live="polite"></div>
    <div class="map-wrap">
      <div id="map-board" class="map-board"></div>
      <button id="btn-final" type="button" class="btn btn-candy" data-action="open-final"></button>
    </div>
  </section>

  <section id="screen-location" class="screen" hidden>
    <div class="topbar">
      <button id="btn-return-map" type="button" class="btn btn-ghost" data-action="go-map"></button>
      <h1 id="location-title" class="title-y2k"></h1>
      <button id="btn-open-help-location" type="button" class="btn btn-ghost" data-action="open-help"></button>
      <button id="btn-open-notebook-location" type="button" class="btn btn-ghost" data-action="open-notebook"></button>
    </div>

    <div id="character-bg" class="scene-banner">
      <img id="character-portrait" class="character-portrait" alt="">
      <div class="glass character-card">
        <h2 id="character-name"></h2>
        <p id="character-role"></p>
      </div>
    </div>

    <section class="glass right-panel">
      <div class="right-head">
        <h2 class="title-y2k">💬 Dialogue</h2>
        <button id="btn-minigame-toggle" type="button" class="btn" data-action="toggle-minigame"></button>
      </div>

      <div id="dialogue-body">
        <div id="dialogue-answer" class="bubble" aria-live="polite"></div>
        <div id="questions-list" class="questions-list"></div>
        <div id="dialogue-feedback" class="dialogue-feedback" aria-live="polite"></div>
      </div>

      <div id="minigame-container" class="minigame-container" hidden></div>
    </section>
  </section>

  <section id="screen-final" class="screen" hidden>
    <div class="glass center-card">
      <div class="topbar">
        <h1 id="final-question" class="title-y2k"></h1>
        <button id="btn-final-return" type="button" class="btn btn-ghost" data-action="go-map"></button>
      </div>
      <div id="final-options" class="final-options"></div>
      <button id="btn-confirm-accusation" type="button" class="btn btn-candy" data-action="confirm-accusation"></button>
      <div id="final-message" class="final-message" aria-live="polite"></div>
      <div id="final-hint" class="final-hint" hidden></div>
    </div>
  </section>

  <section id="screen-victory" class="screen" hidden>
    <div class="glass center-card victory-panel">
      <h1 id="victory-title" class="title-y2k"></h1>
      <img id="victory-image" alt="Celebration at Camp World">
      <p id="victory-text"></p>
      <p id="victory-explanation"></p>
      <button id="btn-victory-return" type="button" class="btn btn-lime" data-action="go-map"></button>
    </div>
  </section>
</main>

<!-- NOTEBOOK -->
<div id="overlay-notebook" class="overlay" hidden>
  <div class="notebook-panel glass" role="dialog" aria-modal="true" aria-labelledby="notebook-title">
    <h2 id="notebook-title" class="title-y2k"></h2>
    <p id="notebook-progress"></p>
    <h3 id="notebook-clues-title"></h3>
    <div id="notebook-clues"></div>
    <h3 id="notebook-notes-title"></h3>
    <div id="notebook-notes"></div>
    <button id="btn-close-notebook" type="button" class="btn" data-action="close-notebook"></button>
  </div>
</div>

<!-- HELP -->
<div id="overlay-help" class="overlay" hidden>
  <div class="help-panel glass" role="dialog" aria-modal="true" aria-labelledby="help-title">
    <h2 id="help-title" class="title-y2k">🕵️ Camp World</h2>
    <div id="help-text" class="help-text"></div>
    <button id="btn-close-help" type="button" class="btn" data-action="close-help"></button>
  </div>
</div>

<div id="aria-announcer" class="visually-hidden" aria-live="polite"></div>

/* ================= STATE ================= */
const gameState = {
  currentScreen: "start", currentLocation: null,
  visitedLocations: [], collectedClues: [], notebookEntries: [],
  playerName: null, finalUnlocked: false, accusedCharacter: null, gameCompleted: false,
  askedQuestions: {}, questionAttempts: {}, miniGameCompleted: {},
  selectedSuspect: null, activeMiniGameId: null, miniGameDraft: null,
  miniGameOpen: false, finalNoteAdded: false
};
let notificationTimer = null;

/* ================= UTILS ================= */
function $(s){ return document.querySelector(s); }
function $$(s){ return Array.from(document.querySelectorAll(s)); }
function getLocation(id){ return GAME_DATA.locations.find(l => l.id === id); }
function getCharacter(id){ return GAME_DATA.characters.find(c => c.id === id); }
function getClue(id){ return GAME_DATA.clues.find(c => c.id === id); }
function hasClue(id){ return gameState.collectedClues.includes(id); }
function getKeyClueCount(){ return GAME_DATA.final.requiredKeyClues.filter(hasClue).length; }
function announce(m){ $("#aria-announcer").textContent = m; }

function normalizeQuestion(text){
  return (text || "").toLowerCase()
    .replace(/[’‘`´]/g, "'")
    .replace(/[^a-z0-9\s']/gi, "")
    .replace(/'/g, "")
    .replace(/\s+/g, " ")
    .trim();
}

function showNotification(m){
  const n = $("#global-notification");
  n.textContent = m; n.hidden = false;
  clearTimeout(notificationTimer);
  notificationTimer = setTimeout(() => { n.hidden = true; }, 3500);
}

/* ================= NAVIGATION ================= */
function showScreen(name){
  $$(".screen").forEach(s => { s.hidden = true; });
  const t = $("#screen-" + name);
  if (t){ t.hidden = false; gameState.currentScreen = name; }
}

function startGame(){ addNote(GAME_DATA.ui.caseNote); renderMap(); showScreen("map"); }

function goToMap(){
  gameState.currentLocation = null;
  closeMiniGame();
  renderMap(); showScreen("map");
}

function openLocation(locationId){
  const location = getLocation(locationId);
  if (!location) return;
  gameState.currentLocation = locationId;
  if (!gameState.visitedLocations.includes(locationId)) gameState.visitedLocations.push(locationId);
  ensureLocationProgress(locationId);
  closeMiniGame();
  renderLocation();
  showScreen("location");
}

function ensureLocationProgress(id){
  if (!gameState.askedQuestions[id]) gameState.askedQuestions[id] = [false,false,false,false];
}

/* ================= START ================= */
function renderStart(){
  $("#start-title").textContent = GAME_DATA.startScreen.title;
  $("#start-image").src = GAME_DATA.startScreen.image;
  const box = $("#start-text"); box.innerHTML = "";
  GAME_DATA.startScreen.text.split("\n").forEach(line => {
    const p = document.createElement("p"); p.textContent = line; box.appendChild(p);
  });
  $("#btn-start").textContent = GAME_DATA.startScreen.button;
}

/* ================= MAP ================= */
function getLocationStatus(loc){
  if (hasClue(loc.keyClueId)) return "completed";
  if (gameState.visitedLocations.includes(loc.id)) return "visited";
  return "not-visited";
}

function renderMap(){
  const board = $("#map-board");
  board.style.backgroundImage = "url('" + GAME_DATA.map.image + "')";
  board.innerHTML = "";

  GAME_DATA.locations.forEach(loc => {
    const status = getLocationStatus(loc);
    let label = GAME_DATA.ui.notVisited;
    if (status === "visited") label = GAME_DATA.ui.visited;
    if (status === "completed") label = GAME_DATA.ui.completed;

    const b = document.createElement("button");
    b.type = "button";
    b.className = "map-location map-location--" + status;
    b.dataset.action = "open-location";
    b.dataset.location = loc.id;
    b.style.left = loc.mapPos.x + "%";
    b.style.top = loc.mapPos.y + "%";
    b.setAttribute("aria-label", loc.name + ", " + label);
    b.innerHTML = `<span>${loc.name}</span><span class="map-status-label">${label}</span>`;
    board.appendChild(b);
  });

  const fb = $("#btn-final"), ms = $("#map-status");
  const kc = getKeyClueCount(), rc = GAME_DATA.final.requiredKeyClues.length;

  if (gameState.gameCompleted){
    fb.disabled = true; fb.textContent = GAME_DATA.ui.caseSolved;
    ms.textContent = GAME_DATA.ui.victory;
  } else if (gameState.finalUnlocked){
    fb.disabled = false; fb.textContent = GAME_DATA.ui.accuseButton;
    ms.textContent = GAME_DATA.ui.keyCluesMessage;
  } else {
    fb.disabled = true; fb.textContent = GAME_DATA.ui.accuseButton;
    ms.textContent = GAME_DATA.ui.lockedFinal + " " + GAME_DATA.ui.keyProgress + ": " + kc + "/" + rc + ".";
  }
}

/* ================= LOCATION ================= */
function renderLocation(){
  const loc = getLocation(gameState.currentLocation);
  if (!loc) return;
  const ch = getCharacter(loc.characterId);
  const mg = GAME_DATA.miniGames[loc.miniGameId];
  const done = Boolean(gameState.miniGameCompleted[mg.id]);

  $("#location-title").textContent = loc.name;
  $("#character-bg").style.backgroundImage = "url('" + loc.image + "')";
  const portrait = $("#character-portrait");
  portrait.src = ch.image; portrait.alt = ch.name;
  $("#character-name").textContent = ch.name;
  $("#character-role").textContent = ch.role;

  $("#dialogue-answer").textContent = GAME_DATA.ui.chooseQuestion;
  $("#dialogue-feedback").textContent = "";
  renderQuestions();

  $("#btn-minigame-toggle").textContent = done ? "🎮 " + GAME_DATA.ui.miniGameCompleted : GAME_DATA.ui.openMiniGame;
}

function renderQuestions(){
  const loc = getLocation(gameState.currentLocation);
  if (!loc) return;
  const list = $("#questions-list"); list.innerHTML = "";

  loc.dialogue.questions.forEach((q, i) => {
    const done = Boolean(gameState.askedQuestions[loc.id][i]);
    const row = document.createElement("div");
    row.className = "q-row";
    row.innerHTML = `
      <span class="chip q-hint">${q.hint}</span>
      <input class="q-input" data-index="${i}" type="text" autocomplete="off"
        placeholder="Type your question..." ${done ? `value="${q.display}" disabled` : ""}>
      <button type="button" class="btn btn-lime q-ask" data-action="ask" data-index="${i}" ${done ? "disabled" : ""}>${done ? "✓" : "Ask"}</button>
    `;
    list.appendChild(row);
  });
}

function askQuestion(index){
  const loc = getLocation(gameState.currentLocation);
  if (!loc) return;
  const i = Number(index);
  const q = loc.dialogue.questions[i];
  if (gameState.askedQuestions[loc.id][i]) return;

  const input = document.querySelector(`.q-input[data-index="${i}"]`);
  const fb = $("#dialogue-feedback");
  const norm = normalizeQuestion(input.value);

  if (q.accepted.map(normalizeQuestion).includes(norm)){
    gameState.askedQuestions[loc.id][i] = true;
    $("#dialogue-answer").textContent = q.answer;
    fb.textContent = ""; fb.className = "dialogue-feedback";
    renderQuestions();
    if (q.clueId && !hasClue(q.clueId)) addClue(q.clueId);
    announce(q.answer);
  } else {
    const key = loc.id + "_" + i;
    gameState.questionAttempts[key] = (gameState.questionAttempts[key] || 0) + 1;
    fb.className = "dialogue-feedback dialogue-feedback--error";
    fb.textContent = gameState.questionAttempts[key] >= 2 ? "Hint: " + q.display : GAME_DATA.ui.notQuite;
  }
}

/* ================= MINI-GAMES ================= */
function setToggleLabel(open){
  const loc = getLocation(gameState.currentLocation);
  const mg = GAME_DATA.miniGames[loc.miniGameId];
  const done = Boolean(gameState.miniGameCompleted[mg.id]);
  $("#btn-minigame-toggle").textContent = open
    ? GAME_DATA.ui.closeMiniGame
    : (done ? "🎮 " + GAME_DATA.ui.miniGameCompleted : GAME_DATA.ui.openMiniGame);
}

function toggleMiniGame(){
  if (gameState.miniGameOpen) closeMiniGame();
  else openMiniGame();
}

function openMiniGame(){
  const loc = getLocation(gameState.currentLocation);
  if (!loc) return;
  const mg = GAME_DATA.miniGames[loc.miniGameId];
  const container = $("#minigame-container");

  if (gameState.miniGameCompleted[mg.id]){
    const clue = getClue(mg.rewardClueId);
    container.innerHTML = `
      <div class="minigame">
        <p><strong>${GAME_DATA.ui.greatJob}</strong></p>
        <p>${clue.description}</p>
        <button type="button" class="btn btn-ghost" data-action="toggle-minigame">${GAME_DATA.ui.closeMiniGame}</button>
      </div>`;
  } else {
    gameState.activeMiniGameId = mg.id;
    gameState.miniGameDraft = { selectedItem: null, assignments: {} };
    renderMiniGame();
  }

  container.hidden = false;
  $("#dialogue-body").hidden = true;
  gameState.miniGameOpen = true;
  $("#screen-location").classList.add("loc--minigame");
  setToggleLabel(true);
}

function closeMiniGame(){
  const container = $("#minigame-container");
  container.hidden = true;
  container.innerHTML = "";
  $("#dialogue-body").hidden = false;
  gameState.miniGameOpen = false;
  gameState.activeMiniGameId = null;
  $("#screen-location").classList.remove("loc--minigame");
  if (gameState.currentLocation) setToggleLabel(false);
}

function renderMiniGame(){
  const mg = GAME_DATA.miniGames[gameState.activeMiniGameId];
  const container = $("#minigame-container");
  if (!mg || !container) return;
  const files = { claw: "claw_game.html", bubble: "bubble_drift.html", verbjump: "game1.html" };
  container.innerHTML = `
    <div class="minigame" style="padding:6px;">
      <h3>${mg.instruction}</h3>
      <p class="minigame__help">${mg.prompt}</p>
      <div class="mg-frame-wrap">
        <iframe allow="autoplay" title="${mg.instruction}"></iframe>
      </div>
      <div class="minigame__actions">
        <button type="button" class="btn btn-ghost" data-action="toggle-minigame">${GAME_DATA.ui.closeMiniGame}</button>
      </div>
    </div>`;
  const f = files[mg.type];
  if (f) container.querySelector("iframe").src = f;
}
}

function getMiniGameHTML(type){
  if (type === "claw") return CLAW_HTML;
  if (type === "bubble") return BUBBLE_HTML;
  if (type === "verbjump") return VERBJUMP_HTML;
  return "";
}

  #claw.has-img .hand, #claw.has-img .prong{display:none;}
  #held{position:absolute; top:34px; left:50%; transform:translateX(-50%);
    width:70px; height:70px; display:flex; align-items:center; justify-content:center;}
  #held-emoji{font-size:44px;}
  #held-img{width:100%; height:100%; object-fit:contain;}
  #controls{display:flex; gap:10px;}
  .btn{min-height:48px; padding:10px 24px; border-radius:999px; cursor:pointer;
    border:2px solid var(--deep); font:inherit; font-weight:800; color:var(--ink);
    text-transform:uppercase; letter-spacing:.05em;
    background:linear-gradient(180deg,#fff 0%,#E4D6FF 40%,#A98BFF 100%);
    box-shadow:inset 0 2px 3px #fff, inset 0 -3px 6px rgba(91,75,196,.3), 0 3px 0 var(--deep), 0 7px 14px rgba(91,75,196,.35);}
  .btn:active{transform:translateY(2px);}
  .btn-candy{color:#8C1D54; border-color:var(--pink-deep);
    background:linear-gradient(180deg,#fff 0%,#FFD9F0 40%,#FF8CC6 100%);
    box-shadow:inset 0 2px 3px #fff, inset 0 -3px 6px rgba(228,107,180,.3), 0 3px 0 var(--pink-deep), 0 7px 14px rgba(255,122,184,.4);}
  .btn-big{min-height:54px; font-size:1.1rem; padding:12px 42px;}
  .overlay{position:fixed; inset:0; z-index:20; display:flex; align-items:center; justify-content:center;
    padding:16px; background:rgba(51,38,143,.45); backdrop-filter:blur(4px);}
  .card{width:min(600px,100%); padding:20px; text-align:center;}
  #pz-visual{margin:6px 0; display:flex; align-items:center; justify-content:center;}
  #pz-emoji{font-size:64px;}
  #pz-img{width:160px; height:160px; object-fit:contain;}
  #slots{display:flex; flex-wrap:wrap; gap:6px; justify-content:center; margin:10px 0;}
  .slot{min-width:34px; height:44px; padding:0 6px; border-radius:10px; border:2px solid var(--peri);
    background:rgba(255,255,255,.92); font-weight:900; font-size:1.2rem; color:var(--ink);
    display:flex; align-items:center; justify-content:center; cursor:pointer;}
  .slot.space{min-width:16px; border:none; background:transparent; cursor:default;}
  .slot.bad{border-color:var(--red); animation:shk .3s ease;}
  @keyframes shk{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
  #tray{display:flex; flex-wrap:wrap; gap:6px; justify-content:center; margin:10px 0;}
  .tile{min-width:38px; height:44px; border-radius:10px; border:2px solid var(--deep); cursor:pointer;
    background:linear-gradient(180deg,#fff,#E4D6FF 60%,#B9A7F2); font-weight:900; font-size:1.2rem; color:var(--ink);
    box-shadow:0 3px 0 var(--deep);}
  .tile:disabled{opacity:.25; cursor:default;}
  #pz-feedback{min-height:24px; font-weight:800; margin:6px 0;}
  #pz-feedback.err{color:var(--red);}
  .tag{font-weight:800; color:var(--deep); margin:6px 0;}
  .how{font-weight:600; font-size:.95rem; background:rgba(255,255,255,.7); border:2px dashed var(--peri);
    border-radius:14px; padding:10px 14px; margin:10px 0;}
  .confetto{position:absolute; z-index:9; pointer-events:none; border-radius:2px;}
</style>
</head>
<body>
<div id="wrap">
  <h1 class="title-y2k">🎁 Claw Machine: Classroom Objects</h1>
  <div id="hud">
    <span id="score">⭐ 0</span>
    <span id="prog"></span>
    <span id="best"></span>
    <button id="btn-sound" type="button">🔊</button>
  </div>
  <div id="cabinet">
    <div id="pit-floor"></div>
    <div id="claw">
      <div id="cable"></div>
      <div class="hand"></div>
      <div class="prong l"></div><div class="prong r"></div>
      <img id="claw-img" alt="" hidden>
      <div id="held" hidden><span id="held-emoji"></span><img id="held-img" alt="" hidden></div>
    </div>
  </div>
  <div id="controls">
    <button id="btn-left" type="button" class="btn">◀</button>
    <button id="btn-drop" type="button" class="btn btn-candy">⬇ Drop</button>
    <button id="btn-right" type="button" class="btn">▶</button>
  </div>
</div>

<div id="pz" class="overlay" hidden>
  <div class="glass card">
    <h2 class="title-y2k">You caught it!</h2>
    <div id="pz-visual"><span id="pz-emoji"></span><img id="pz-img" alt="" hidden></div>
    <p class="tag">Build the word from the letters:</p>
    <div id="slots"></div>
    <div id="tray"></div>
    <div id="pz-feedback"></div>
    <button id="pz-reset" type="button" class="btn">Reset</button>
  </div>
</div>

<div id="menu" class="overlay">
  <div class="glass card">
    <h1 class="title-y2k">🎁 Claw Machine</h1>
    <p class="tag">Classroom Objects</p>
    <p class="how">Move the claw with <b>◀ ▶</b> (or <b>← →</b>), press <b>DROP</b> (or <b>Space</b>) to grab a plushie.
      Then build its name from the letters! Catch all <b id="goal"></b> objects to win.</p>
    <button id="btn-start" type="button" class="btn btn-candy btn-big">Play ▶</button>
  </div>
</div>

<div id="end" class="overlay" hidden>
  <div class="glass card">
    <h1 id="end-title" class="title-y2k"></h1>
    <p id="end-text" class="tag"></p>
    <p id="end-stats" class="tag"></p>
    <button id="btn-again" type="button" class="btn btn-candy btn-big">Play again ↻</button>
  </div>
</div>

<script>
const WORDS = [
  ["bag","🎒","images/bag.png"],
  ["board","🟩","images/board.png"],
  ["bookshelf","📚","images/bookshelf.png"],
  ["desk","🪑","images/desk.png"],
  ["dictionary","📖","images/dictionary.png"],
  ["laptop","💻","images/laptop.png"],
  ["notebook","📓","images/notebook.png"],
  ["pen","🖊️","images/pen.png"],
  ["pencil","✏️","images/pencil.png"],
  ["pencil sharpener","⚙️","images/pencil_sharpener.png"],
  ["rubber","🧽","images/rubber.png"],
  ["ruler","📏","images/ruler.png"]
];
const GOAL = WORDS.length;
const STORAGE_KEY = "clawBest";
const SKINS = { claw: "images/claw.png", machine: "images/machine.png" };

const $ = s => document.querySelector(s);
const cab=$("#cabinet"), claw=$("#claw"), cable=$("#cable"), clawImg=$("#claw-img"),
  held=$("#held"), heldEmoji=$("#held-emoji"), heldImg=$("#held-img"),
  scoreEl=$("#score"), progEl=$("#prog"), bestEl=$("#best"),
  pz=$("#pz"), pzEmoji=$("#pz-emoji"), pzImg=$("#pz-img"),
  slotsEl=$("#slots"), trayEl=$("#tray"), pzFb=$("#pz-feedback"),
  menu=$("#menu"), end=$("#end");
$("#goal").textContent = GOAL;

let W=0,H=0,minX=40,maxX=0,maxY=0;
let clawX=120, clawY=0, phase="idle", heldPlush=null;
let leftDown=false, rightDown=false, busy=false;
let plushies=[], collected=new Set(), score=0, best=0, muted=false;
let target="", slots=[], attempts=0, lastT=0;
const IMG={};

let ac=null;
function beep(f,d,type,when,slide){ if(muted) return;
  try{ ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    const t=ac.currentTime+(when||0), o=ac.createOscillator(), g=ac.createGain();
    o.type=type||"sine"; o.frequency.setValueAtTime(f,t);
    if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);
    g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.2,t+.02); g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t+d+.05);}catch(e){} }

function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function loadBest(){ try{ best=+localStorage.getItem(STORAGE_KEY)||0; }catch(e){} }
function saveBest(){ try{ localStorage.setItem(STORAGE_KEY,best); }catch(e){} }
function hud(){ scoreEl.textContent="⭐ "+score;
  progEl.textContent="Words "+collected.size+"/"+GOAL;
  bestEl.textContent="👑 "+best; }
function cut(img){ try{ const c=document.createElement("canvas"); c.width=img.naturalWidth; c.height=img.naturalHeight;
  const x=c.getContext("2d"); x.drawImage(img,0,0); const d=x.getImageData(0,0,c.width,c.height), p=d.data;
  for(let i=0;i<p.length;i+=4){ if(p[i]>235&&p[i+1]>235&&p[i+2]>235)p[i+3]=0; else if(p[i]>210&&p[i+1]>210&&p[i+2]>210)p[i+3]=110; }
  x.putImageData(d,0,0); return {src:c.toDataURL(),clean:true}; }catch(e){ return {src:img.src,clean:false}; } }

/* Картинки: перебираем варианты имени файла (пробел / _ / - / слитно) в images/ и в корне */
function variants(p){
  const base = p.replace(/^images\//,"").replace(/\.(png|jpe?g|svg|webp)$/i,"");
  const parts = base.split(/[_\-\s]+/);
  const out = []; const seen = {};
  ["_","-"," ",""].forEach(s=>{
    const name = parts.join(s);
    ["images/"+name+".png", name+".png"].forEach(u=>{ if(!seen[u]){ seen[u]=1; out.push(u); } });
  });
  if (!seen[p]) out.push(p);
  return out;
}
function loadWithFallback(path, onOk){
  const list = variants(path); let i = 0;
  (function next(){
    if (i >= list.length) return;
    const im = new Image();
    im.onload = () => onOk(im);
    im.onerror = () => { i++; next(); };
    im.src = list[i];
  })();
}
function preloadImages(){
  WORDS.forEach(w=>{ loadWithFallback(w[2], im=>{ IMG[w[0]]=cut(im); }); });
  loadWithFallback(SKINS.claw, ci=>{ const r=cut(ci); clawImg.src=r.src; clawImg.hidden=false;
    if(!r.clean) clawImg.classList.add("blend"); claw.classList.add("has-img"); });
  loadWithFallback(SKINS.machine, mi=>{ cab.style.backgroundImage="url('"+mi.src+"')"; });
}
function setVisual(imgEl, emojiEl, word, emoji){
  const r = IMG[word];
  const entry = WORDS.find(x => x[0] === word);
  const raw = entry ? entry[2] : "";
  emojiEl.textContent = emoji; emojiEl.style.display = "";
  imgEl.hidden = true;
  imgEl.onload = () => { imgEl.hidden = false; emojiEl.style.display = "none"; };
  if (r){ imgEl.onerror = null; imgEl.classList.toggle("blend", !r.clean); imgEl.src = r.src; }
  else if (raw){
    imgEl.classList.add("blend");
    const list = variants(raw); let i = 0;
    imgEl.onerror = () => { i++; if (i < list.length) imgEl.src = list[i];
      else { imgEl.hidden = true; emojiEl.style.display = ""; } };
    imgEl.src = list[0];
  }
}

function measure(){ const r=cab.getBoundingClientRect(); W=r.width; H=r.height;
  maxX=W-40; maxY=H-150; }
function spawnPlushies(){
  plushies.forEach(p=>p.el.remove()); plushies=[];
  const pool=shuffle(WORDS.filter(w=>!collected.has(w[0]))).slice(0,5);
  const innerW=W-120;
  pool.forEach((w,i)=>{
    const el=document.createElement("div"); el.className="plush";
    el.innerHTML='<span class="p-emoji"></span><img alt="" hidden>';
    setVisual(el.querySelector("img"), el.querySelector(".p-emoji"), w[0], w[1]);
    const x=45+(i+0.5)*(innerW/pool.length)+(Math.random()*24-12);
    el.style.left=(x-44)+"px";
    cab.appendChild(el);
    plushies.push({word:w[0],emoji:w[1],x,el});
  });
}
function drop(){ if(busy||phase!=="idle") return; busy=true; phase="dropping"; beep(300,.15,"square",0,180); }
function grab(){
  let near=null, nd=1e9;
  plushies.forEach(p=>{ const d=Math.abs(p.x-clawX); if(d<nd){nd=d;near=p;} });
  if(near && nd<48){ heldPlush=near; near.el.remove(); plushies=plushies.filter(p=>p!==near);
    setVisual(heldImg, heldEmoji, heldPlush.word, heldPlush.emoji);
    held.hidden=false; beep(660,.1); }
  else { heldPlush=null; beep(220,.2,"sawtooth",0,110); }
  phase="rising";
}
function afterRise(){
  if(heldPlush){ openPuzzle(heldPlush); }
  else { busy=false; showTip("Empty! Try again."); }
  phase="idle";
}
function showTip(t){
  const el=document.createElement("div"); el.className="tag";
  el.style.cssText="position:absolute;top:40%;left:50%;transform:translateX(-50%);background:rgba(255,255,255,.9);border-radius:999px;padding:6px 16px;z-index:8;";
  el.textContent=t; cab.appendChild(el);
  setTimeout(()=>el.remove(),1200);
}
function loop(t){
  const dt=Math.min(50,t-(lastT||t)); lastT=t;
  if(phase==="idle"){
    if(leftDown) clawX-=dt*0.35;
    if(rightDown) clawX+=dt*0.35;
    clawX=Math.max(minX,Math.min(maxX,clawX));
  } else if(phase==="dropping"){
    clawY+=dt*0.5;
    if(clawY>=maxY){ clawY=maxY; grab(); }
  } else if(phase==="rising"){
    clawY-=dt*0.45;
    if(clawY<=0){ clawY=0; afterRise(); }
  }
  claw.style.transform="translate("+(clawX-30)+"px,"+clawY+"px)";
  cable.style.height=(40+clawY)+"px";
  requestAnimationFrame(loop);
}

function openPuzzle(plush){
  target=plush.word; attempts=0;
  setVisual(pzImg, pzEmoji, plush.word, plush.emoji);
  pzFb.textContent=""; pzFb.className="";
  slots=target.split("").map(ch=>({ch:ch===" ",letter:null,space:ch===" ",tile:null}));
  const letters=shuffle(target.replace(/ /g,"").split(""));
  if(letters.join("")===target.replace(/ /g,"")) letters.reverse();
  trayEl.innerHTML="";
  letters.forEach((L,i)=>{
    const b=document.createElement("button"); b.type="button"; b.className="tile"; b.textContent=L; b.dataset.i=i;
    b.addEventListener("click",()=>placeTile(b,L));
    trayEl.appendChild(b);
  });
  renderSlots();
  pz.hidden=false;
}
function placeTile(btn,L){
  const idx=slots.findIndex(s=>!s.space&&!s.letter);
  if(idx<0) return;
  slots[idx].letter=L; slots[idx].tile=btn; btn.disabled=true;
  renderSlots(); maybeCheck();
}
function removeSlot(i){
  const s=slots[i]; if(s.space||!s.letter) return;
  if(s.tile) s.tile.disabled=false;
  s.letter=null; s.tile=null; renderSlots();
}
function renderSlots(){
  slotsEl.innerHTML="";
  slots.forEach((s,i)=>{
    const d=document.createElement("div");
    d.className="slot"+(s.space?" space":"");
    d.textContent=s.space?"":(s.letter||"");
    if(!s.space) d.addEventListener("click",()=>removeSlot(i));
    slotsEl.appendChild(d);
  });
}
function maybeCheck(){
  if(slots.some(s=>!s.space&&!s.letter)) return;
  const built=slots.map(s=>s.space?" ":s.letter).join("");
  if(built===target){ solved(); }
  else { attempts=1; pzFb.textContent="Not quite! Tap a letter to fix."; pzFb.className="err";
    slotsEl.querySelectorAll(".slot:not(.space)").forEach(el=>el.classList.add("bad"));
    setTimeout(()=>slotsEl.querySelectorAll(".slot").forEach(el=>el.classList.remove("bad")),400);
    beep(220,.25,"sawtooth",0,110); }
}
function solved(){
  pzFb.textContent="✅ "+target+"!"; pzFb.className="";
  const gain=10+(attempts===0?5:0); score+=gain;
  collected.add(target); hud();
  beep(660,.12); beep(880,.14,"sine",.1);
  confetti();
  setTimeout(()=>{
    pz.hidden=true; held.hidden=true; heldImg.hidden=true; heldEmoji.style.display=""; heldPlush=null;
    if(collected.size>=GOAL) return endGame(true);
    if(plushies.length===0) spawnPlushies();
    busy=false;
  },900);
}
$("#pz-reset").addEventListener("click",()=>{
  slots.forEach(s=>{ if(s.tile) s.tile.disabled=false; s.letter=null; s.tile=null; });
  renderSlots(); pzFb.textContent=""; pzFb.className="";
});
function confetti(){
  const cols=["#FF8CC6","#8F7BEB","#8FE8F0","#FFD34D","#8FD14F","#fff"];
  for(let i=0;i<30;i++){ const c=document.createElement("span"); c.className="confetto";
    const s=6+Math.random()*8;
    c.style.cssText="left:"+(Math.random()*100)+"%;top:-20px;width:"+s+"px;height:"+s+"px;background:"+cols[i%6]+";";
    document.body.appendChild(c);
    c.animate([{transform:"translateY(0)",opacity:1},{transform:"translateY("+(innerHeight+40)+"px) rotate(720deg)",opacity:.9}],
      {duration:900+Math.random()*700,easing:"ease-in"}).onfinish=()=>c.remove(); }
}

function start(){
  collected=new Set(); score=0; busy=false; phase="idle"; clawY=0; clawX=W/2;
  menu.hidden=true; end.hidden=true; pz.hidden=true; held.hidden=true;
  spawnPlushies(); hud();
}
function endGame(win){
  if(score>best){ best=score; saveBest(); }
  $("#end-title").textContent=win?"🏆 You win!":"Game over!";
  $("#end-text").textContent=win?"All "+GOAL+" objects collected — amazing!":"The machine waits for you...";
  $("#end-stats").textContent=score+" points • "+best+" best • "+collected.size+" words";
  end.hidden=false; hud();
  if(win){ try{ window.parent.postMessage({type:"minigame-won", id:"claw"}, "*"); }catch(e){} }
}

$("#btn-start").addEventListener("click",start);
$("#btn-again").addEventListener("click",start);
$("#btn-drop").addEventListener("click",drop);
$("#btn-sound").addEventListener("click",()=>{ muted=!muted; $("#btn-sound").textContent=muted?"🔇":"🔊"; });
function bindHold(el,set){
  el.addEventListener("pointerdown",e=>{e.preventDefault(); set(true);});
  ["pointerup","pointerleave","pointercancel"].forEach(ev=>el.addEventListener(ev,()=>set(false)));
}
bindHold($("#btn-left"),v=>leftDown=v);
bindHold($("#btn-right"),v=>rightDown=v);
document.addEventListener("keydown",e=>{
  if(!pz.hidden) return;
  if(e.key==="ArrowLeft"){ leftDown=true; e.preventDefault(); }
  else if(e.key==="ArrowRight"){ rightDown=true; e.preventDefault(); }
  else if(e.code==="Space"||e.key==="ArrowDown"){ drop(); e.preventDefault(); }
});
document.addEventListener("keyup",e=>{
  if(e.key==="ArrowLeft") leftDown=false;
  if(e.key==="ArrowRight") rightDown=false;
});
window.addEventListener("resize",measure);

loadBest(); measure(); hud(); preloadImages();
requestAnimationFrame(loop);
<\/script>
</body>
</html>`;

    border:3px solid var(--deep); border-radius:22px;
    box-shadow:inset 0 0 0 3px #fff, inset 0 4px 12px rgba(255,255,255,.9), 0 10px 26px rgba(91,75,196,.4);}
  .title-y2k{background:linear-gradient(100deg,#fff 0%,#FFD9F0 25%,#B9A7F2 50%,#8FE8F0 75%,#fff 100%);
    background-size:220% 100%; -webkit-background-clip:text; background-clip:text; color:transparent;
    -webkit-text-stroke:1.5px var(--deep);
    filter:drop-shadow(0 2px 0 #fff) drop-shadow(0 5px 12px rgba(91,75,196,.5));
    font-weight:900; letter-spacing:.04em; text-transform:uppercase; animation:holo 7s linear infinite;
    margin:0; font-size:clamp(1.1rem,3.6vw,2rem);}
  @keyframes holo{0%{background-position:0% 50%}100%{background-position:220% 50%}}
  .bubble{position:absolute; left:0; top:0; border-radius:50%; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    border:2px solid rgba(255,255,255,.65);
    background:radial-gradient(circle at 32% 28%, rgba(255,255,255,.95) 0%, rgba(255,255,255,.35) 16%, rgba(255,255,255,.08) 38%, transparent 60%),
      radial-gradient(circle at 68% 74%, rgba(255,255,255,.3), transparent 45%),
      conic-gradient(from 200deg, rgba(255,140,196,.28), rgba(143,232,240,.28), rgba(185,167,242,.28), rgba(255,211,77,.22), rgba(255,140,196,.28)),
      radial-gradient(circle at 50% 50%, rgba(255,255,255,.05) 58%, rgba(185,167,242,.20) 80%, rgba(143,232,240,.35) 93%, rgba(255,255,255,.55) 100%);
    box-shadow:inset 0 0 14px rgba(255,255,255,.5), 0 16px 26px rgba(91,75,196,.18);
    background-size:100% 100%; will-change:transform; z-index:2;}
  .bubble::after{content:""; position:absolute; left:22%; top:16%; width:14%; height:9%;
    border-radius:50%; background:rgba(255,255,255,.9); transform:rotate(-25deg);
    filter:blur(1px);}
  .bubble span{pointer-events:none; filter:drop-shadow(0 2px 4px rgba(51,38,143,.45)); opacity:.9;}
  .bubble.blend{background-blend-mode:multiply;}
  .bubble.pop{animation:pop .45s ease forwards;}
  @keyframes pop{40%{transform:scale(1.25); opacity:1}100%{transform:scale(1.6); opacity:0}}
  .pring{position:absolute; border:4px solid rgba(255,255,255,.85); border-radius:50%; z-index:3;
    pointer-events:none; animation:pring .5s ease forwards;
    box-shadow:0 0 20px rgba(255,255,255,.6), inset 0 0 14px rgba(255,255,255,.5);}
  @keyframes pring{to{transform:scale(1.55); opacity:0;}}
  .confetto{position:absolute; z-index:4; pointer-events:none; border-radius:2px;}
  .overlay{position:fixed; inset:0; z-index:20; display:flex; align-items:center; justify-content:center;
    padding:16px; background:rgba(51,38,143,.45); backdrop-filter:blur(4px);}
  .card{width:min(620px,100%); padding:18px; text-align:center;}
  #qtext{font-size:clamp(1rem,2.6vw,1.35rem); font-weight:800; margin:8px 0;}
  #opts{display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin:10px 0;}
  .opt-btn{min-height:52px; padding:10px 22px; border-radius:999px; cursor:pointer;
    border:2px solid var(--deep); font:inherit; font-weight:900; font-size:1.05rem; color:var(--ink);
    background:linear-gradient(180deg,#fff 0%,#E4D6FF 40%,#A98BFF 100%);
    box-shadow:inset 0 2px 3px #fff, 0 3px 0 var(--deep), 0 7px 14px rgba(91,75,196,.35);}
  .opt-btn.good{border-color:var(--lime-deep); background:linear-gradient(180deg,#fff,#E4FFB0 40%,#8FD14F);}
  .opt-btn.bad{border-color:var(--red); background:linear-gradient(180deg,#fff,#FFD9D9 40%,#FF8C8C); animation:shk .3s ease;}
  @keyframes shk{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  #tfb{min-height:24px; font-weight:800;}
  #tfb.err{color:var(--red);}
  .tag{font-weight:800; color:var(--deep); margin:6px 0;}
  .how{font-weight:600; font-size:.95rem; background:rgba(255,255,255,.7); border:2px dashed var(--peri);
    border-radius:14px; padding:10px 14px; margin:10px 0;}
  .btn{min-height:48px; padding:10px 26px; border-radius:999px; cursor:pointer;
    border:2px solid var(--deep); font:inherit; font-weight:800; color:var(--ink);
    text-transform:uppercase; letter-spacing:.05em;
    background:linear-gradient(180deg,#fff 0%,#E4D6FF 40%,#A98BFF 100%);
    box-shadow:inset 0 2px 3px #fff, inset 0 -3px 6px rgba(91,75,196,.3), 0 3px 0 var(--deep), 0 7px 14px rgba(91,75,196,.35);}
  .btn-candy{color:#8C1D54; border-color:var(--pink-deep);
    background:linear-gradient(180deg,#fff 0%,#FFD9F0 40%,#FF8CC6 100%);
    box-shadow:inset 0 2px 3px #fff, inset 0 -3px 6px rgba(228,107,180,.3), 0 3px 0 var(--pink-deep), 0 7px 14px rgba(255,122,184,.4);}
  .btn-big{min-height:54px; font-size:1.1rem; padding:12px 42px;}
  .scene{position:relative; width:170px; height:115px; margin:2px auto 0;}
  .sc-box{position:absolute; left:50%; top:45px; transform:translateX(-50%); width:74px; height:46px;
    background:linear-gradient(180deg,#FFD9F0,#B9A7F2); border:3px solid #fff; border-radius:10px; z-index:1;
    box-shadow:0 4px 8px rgba(91,75,196,.3);}
  .sc-box-front{position:absolute; left:50%; top:66px; transform:translateX(-50%); width:74px; height:26px;
    background:linear-gradient(180deg,#E4D6FF,#B9A7F2); border:3px solid #fff; border-radius:0 0 10px 10px; z-index:3;}
  .sc-ball{position:absolute; width:26px; height:26px; border-radius:50%;
    background:radial-gradient(circle at 30% 30%,#fff,#FF8CC6 55%,#E46BB4); border:2px solid #fff;}
  .sc-hero{position:absolute; left:4px; bottom:0; font-size:30px;}
  .sc-pen{position:absolute; width:36px; height:9px; border-radius:5px;
    background:linear-gradient(90deg,#8FE8F0,#5B4BC4); border:2px solid #fff;}
  .sc-char{position:absolute; left:10px; bottom:4px; font-size:26px; text-align:center;}
  .sc-char b{display:block; font-size:12px; color:var(--ink);}
  .sc-obj{position:absolute; right:30px; bottom:10px; font-size:30px;}
</style>
</head>
<body>
<div id="game">
  <div id="arena">
    <div class="sky"></div>
    <div class="wall"></div>
    <div class="floor">
      <div class="fring r1"></div><div class="fring r2"></div><div class="fring r3"></div>
    </div>
  </div>
  <div id="hud">
    <div class="grp"><span id="taskpill">Task 1/12</span></div>
    <div class="grp">
      <span id="score">⭐ 0</span>
      <span id="hearts"></span>
      <span id="best"></span>
      <button id="btn-sound" type="button">🔊</button>
    </div>
  </div>
</div>

<div id="task" class="overlay" hidden>
  <div class="glass card">
    <h2 class="title-y2k">🫧 Task</h2>
    <div id="scene"></div>
    <div id="qtext"></div>
    <div id="opts"></div>
    <div id="tfb"></div>
  </div>
</div>

<div id="menu" class="overlay">
  <div class="glass card">
    <h1 class="title-y2k">🫧 Bubble Drift</h1>
    <p class="tag">Prepositions • This/That • Possessives • to be</p>
    <p class="how">ALL the bubbles are on the screen and they move fast!
      <b>Catch one</b> to open a task. Answer correctly and the bubble <b>pops</b>!
      Wrong answer = −1 ❤. Solve <b id="goal"></b> to win!</p>
    <button id="btn-start" type="button" class="btn btn-candy btn-big">Play ▶</button>
  </div>
</div>

<div id="end" class="overlay" hidden>
  <div class="glass card">
    <h1 id="end-title" class="title-y2k"></h1>
    <p id="end-text" class="tag"></p>
    <p id="end-stats" class="tag"></p>
    <button id="btn-again" type="button" class="btn btn-candy btn-big">Play again ↻</button>
  </div>
</div>

<script>
const WIN = 12;
const STORAGE_KEY = "driftBest";
const SKINS = { background: "images/background.png", bubble: "images/bubble.png" };

const TASKS = [
  { cat:"prep", scene:{k:"prep",p:"on"},  q:"Where is the ball? It's ___ the box.", options:["on","in","under"], c:"on" },
  { cat:"prep", scene:{k:"prep",p:"in"},  q:"Where is the ball? It's ___ the box.", options:["in","on","behind"], c:"in" },
  { cat:"prep", scene:{k:"prep",p:"under"}, q:"Where is the ball? It's ___ the box.", options:["under","next to","on"], c:"under" },
  { cat:"prep", scene:{k:"prep",p:"next to"}, q:"Where is the ball? It's ___ the box.", options:["next to","behind","in"], c:"next to" },
  { cat:"prep", scene:{k:"prep",p:"in front of"}, q:"Where is the ball? It's ___ the box.", options:["in front of","behind","under"], c:"in front of" },
  { cat:"prep", scene:{k:"prep",p:"behind"}, q:"Where is the ball? It's ___ the box.", options:["behind","in front of","next to"], c:"behind" },
  { cat:"demo", scene:{k:"demo",d:"this"},  q:"___ is a pen.", options:["This","That","These"], c:"This" },
  { cat:"demo", scene:{k:"demo",d:"that"},  q:"___ is a pen.", options:["That","This","Those"], c:"That" },
  { cat:"demo", scene:{k:"demo",d:"these"}, q:"___ are pens.", options:["These","Those","This"], c:"These" },
  { cat:"demo", scene:{k:"demo",d:"those"}, q:"___ are pens.", options:["Those","These","That"], c:"Those" },
  { cat:"poss", scene:{k:"char",who:"👧",name:"Ana",obj:"🎒"}, q:"This is ___ bag.", options:["her","hers","she"], c:"her" },
  { cat:"poss", q:"The bag is ___. (Ana)", options:["hers","her","she"], c:"hers" },
  { cat:"poss", scene:{k:"char",who:"👦",name:"Ken",obj:"💻"}, q:"This is ___ laptop.", options:["his","him","he"], c:"his" },
  { cat:"poss", q:"The laptop is ___. (Ken)", options:["his","him","he"], c:"his" },
  { cat:"poss", q:"Is this ___ pencil? — Yes, it's mine! (you)", options:["your","yours","you"], c:"your" },
  { cat:"poss", scene:{k:"char",who:"👩",name:"Mia",obj:"📚"}, q:"These are ___ books.", options:["her","hers","she"], c:"her" },
  { cat:"s", q:"___ bag is this? — It's Ana's.", options:["Whose","Who","Who's"], c:"Whose" },
  { cat:"s", q:"This is ___ notebook. (Mia)", options:["Mia's","Mias","Mia"], c:"Mia's" },
  { cat:"s", q:"The ruler is ___. (Ken)", options:["Ken's","Ken","Kens"], c:"Ken's" },
  { cat:"be", q:"They ___ from Turkey.", options:["are","is","am"], c:"are" },
  { cat:"be", q:"She ___ British.", options:["is","are","am"], c:"is" },
  { cat:"be", q:"I ___ a student.", options:["am","is","are"], c:"am" },
  { cat:"be", q:"___ you from India?", options:["Are","Is","Am"], c:"Are" },
  { cat:"be", q:"We ___ not at school.", options:["are","is","am"], c:"are" },
  { cat:"be", q:"___ Mia a teacher? — Yes, she is.", options:["Is","Are","Am"], c:"Is" }
];

const $ = s => document.querySelector(s);
const gameEl=$("#game"), arena=$("#arena"), sceneEl=$("#scene"), qtextEl=$("#qtext"), optsEl=$("#opts"), tfb=$("#tfb"),
  taskpill=$("#taskpill"), scoreEl=$("#score"), heartsEl=$("#hearts"), bestEl=$("#best"),
  taskOv=$("#task"), menu=$("#menu"), end=$("#end");
$("#goal").textContent = WIN;

let W=0,H=0, paused=true, muted=false, busy=false;
let bubbles=[], activeBubble=null, lastT=0, ambientTimer=0;
const state={ score:0, combo:0, hearts:3, solved:0, best:0 };

let ac=null;
function beep(f,d,type,when,slide){ if(muted) return;
  try{ ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    const t=ac.currentTime+(when||0), o=ac.createOscillator(), g=ac.createGain();
    o.type=type||"sine"; o.frequency.setValueAtTime(f,t);
    if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);
    g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.2,t+.02); g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t+d+.05);}catch(e){} }

function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function loadBest(){ try{ state.best=+localStorage.getItem(STORAGE_KEY)||0; }catch(e){} }
function saveBest(){ try{ localStorage.setItem(STORAGE_KEY,state.best); }catch(e){} }
function hud(){ scoreEl.textContent="⭐ "+state.score;
  taskpill.textContent="Task "+Math.min(state.solved+1,WIN)+"/"+WIN;
  heartsEl.textContent="💖".repeat(state.hearts)+"🤍".repeat(Math.max(0,3-state.hearts));
  bestEl.textContent="👑 "+state.best; }
function cut(img){ try{ const c=document.createElement("canvas"); c.width=img.naturalWidth; c.height=img.naturalHeight;
  const x=c.getContext("2d"); x.drawImage(img,0,0); const d=x.getImageData(0,0,c.width,c.height), p=d.data;
  for(let i=0;i<p.length;i+=4){ if(p[i]>235&&p[i+1]>235&&p[i+2]>235)p[i+3]=0; else if(p[i]>210&&p[i+1]>210&&p[i+2]>210)p[i+3]=110; }
  x.putImageData(d,0,0); return {src:c.toDataURL(),clean:true}; }catch(e){ return {src:img.src,clean:false}; } }
function altPath(p){ return p.indexOf("images/")===0 ? p.slice(7) : "images/"+p; }
function applySkins(){
  const b=new Image();
  b.onload=()=>{ gameEl.style.backgroundImage="url('"+b.src+"')"; arena.style.display="none"; };
  b.onerror=()=>{ const b2=new Image(); b2.onload=()=>{ gameEl.style.backgroundImage="url('"+b2.src+"')"; arena.style.display="none"; }; b2.src=altPath(SKINS.background); };
  b.src=SKINS.background;
  const u=new Image();
  u.onload=()=>{ window.__bubbleSkin=cut(u); };
  u.onerror=()=>{ const u2=new Image(); u2.onload=()=>{ window.__bubbleSkin=cut(u2); }; u2.src=altPath(SKINS.bubble); };
  u.src=SKINS.bubble;
}

function renderScene(sp){
  if(!sp){ sceneEl.innerHTML=""; return; }
  let h='<div class="scene">';
  if(sp.k==="prep"){
    const P=sp.p;
    if(P==="in") h+='<div class="sc-box"></div><div class="sc-ball" style="left:50%;margin-left:-13px;top:42px;z-index:2;"></div><div class="sc-box-front"></div>';
    else if(P==="behind") h+='<div class="sc-ball" style="left:50%;margin-left:-13px;top:26px;z-index:0;"></div><div class="sc-box"></div>';
    else if(P==="on") h+='<div class="sc-box"></div><div class="sc-ball" style="left:50%;margin-left:-13px;top:16px;z-index:2;"></div>';
    else if(P==="under") h+='<div class="sc-box"></div><div class="sc-ball" style="left:50%;margin-left:-13px;top:96px;z-index:2;"></div>';
    else if(P==="next to") h+='<div class="sc-box"></div><div class="sc-ball" style="left:calc(50% + 46px);top:70px;z-index:2;"></div>';
    else h+='<div class="sc-box"></div><div class="sc-ball" style="left:50%;margin-left:-13px;top:78px;z-index:4;"></div>';
  }
  if(sp.k==="demo"){
    h+='<div class="sc-hero">🕵️</div>';
    const D=sp.d;
    if(D==="this") h+='<div class="sc-pen" style="right:26px;bottom:8px;"></div>';
    if(D==="that") h+='<div class="sc-pen" style="right:16px;top:6px;"></div>';
    if(D==="these") h+='<div class="sc-pen" style="right:24px;bottom:8px;"></div><div class="sc-pen" style="right:66px;bottom:8px;"></div>';
    if(D==="those") h+='<div class="sc-pen" style="right:16px;top:6px;"></div><div class="sc-pen" style="right:60px;top:6px;"></div>';
  }
  if(sp.k==="char") h+='<div class="sc-char">'+sp.who+'<b>'+sp.name+'</b></div><div class="sc-obj">'+sp.obj+'</div>';
  sceneEl.innerHTML=h+"</div>";
}

function confetto(colors){
  const c=document.createElement("span"); c.className="confetto";
  const s=5+Math.random()*7;
  c.style.cssText="left:"+(Math.random()*100)+"%;top:-15px;width:"+s+"px;height:"+(s*1.6)+"px;background:"+colors[Math.floor(Math.random()*colors.length)]+";";
  gameEl.appendChild(c);
  c.animate([{transform:"translateY(0) rotate(0)",opacity:1},
    {transform:"translateY("+(H+40)+"px) rotate("+(360+Math.random()*540)+"deg)",opacity:.85}],
    {duration:1400+Math.random()*1200, easing:"ease-in"}).onfinish=()=>c.remove();
}
function burstConfetti(){ const cols=["#FF8CC6","#8F7BEB","#8FE8F0","#FFD34D","#8FD14F","#fff"];
  for(let i=0;i<24;i++) confetto(cols); }
function startAmbient(){ stopAmbient();
  const gold=["#e8c26a","#d9a83f","#fff2c9","#caa04a","#ffe9a8"];
  ambientTimer=setInterval(()=>{ if(!paused) confetto(gold); },380); }
function stopAmbient(){ clearInterval(ambientTimer); }

function measure(){ W=gameEl.clientWidth; H=gameEl.clientHeight; }
function spawnBubble(taskIdx){
  const r=40+Math.random()*25;
  const el=document.createElement("div");
  el.className="bubble";
  el.style.width=el.style.height=(r*2)+"px";
  if(window.__bubbleSkin){ el.style.backgroundImage="url('"+window.__bubbleSkin.src+"')";
    if(!window.__bubbleSkin.clean) el.classList.add("blend"); }
  gameEl.appendChild(el);
  const b={ el, r, task:taskIdx,
    x:r+Math.random()*(W-2*r), y:90+Math.random()*(H-160),
    vx:(Math.random()<.5?-1:1)*(0.9+Math.random()*0.9),
    vy:(Math.random()<.5?-1:1)*(0.45+Math.random()*0.45),
    ph:Math.random()*6.28 };
  el.addEventListener("click",()=>openTask(b));
  bubbles.push(b);
  place(b);
}
function place(b){ b.el.style.transform="translate("+(b.x-b.r)+"px,"+(b.y-b.r)+"px)"; }
function removeBubble(b){ b.el.remove(); bubbles=bubbles.filter(x=>x!==b); }
function burstRing(x,y,r){ const d=document.createElement("div"); d.className="pring";
  d.style.left=(x-r-12)+"px"; d.style.top=(y-r-12)+"px";
  d.style.width=d.style.height=(r*2+24)+"px";
  gameEl.appendChild(d); setTimeout(()=>d.remove(),520); }
function loop(t){
  const dt=Math.min(50,t-(lastT||t)); lastT=t;
  if(!paused){
    for(const b of bubbles){
      b.x+=b.vx*dt*0.22; b.y+=b.vy*dt*0.22 + Math.sin(t/700+b.ph)*0.25;
      if(b.x<-b.r-10) b.x=W+b.r; if(b.x>W+b.r+10) b.x=-b.r;
      if(b.y<80){ b.y=80; b.vy=Math.abs(b.vy); }
      if(b.y>H-b.r){ b.y=H-b.r; b.vy=-Math.abs(b.vy); }
      place(b);
    }
  }
  requestAnimationFrame(loop);
}

function openTask(b){
  if(paused||busy) return;
  activeBubble=b; paused=true; busy=true;
  const t=TASKS[b.task];
  renderScene(t.scene);
  qtextEl.textContent=t.q;
  tfb.textContent=""; tfb.className="";
  optsEl.innerHTML="";
  shuffle(t.options.slice()).forEach(opt=>{
    const btn=document.createElement("button");
    btn.type="button"; btn.className="opt-btn"; btn.textContent=opt;
    btn.addEventListener("click",()=>answer(btn,opt,t));
    optsEl.appendChild(btn);
  });
  taskOv.hidden=false;
  beep(500,.1,"sine",0,700);
}
function afterRemove(){
  if(state.solved>=WIN || state.hearts<=0 || bubbles.length===0)
    endGame(state.solved>=WIN);
}
function answer(btn,opt,t){
  if(!busy) return;
  busy=false;
  if(opt===t.c){
    btn.classList.add("good");
    state.combo++;
    const gain=10+(state.combo-1)*2;
    state.score+=gain; state.solved++;
    tfb.textContent="✅ +"+gain; tfb.className="";
    beep(660,.12); beep(880,.14,"sine",.1);
    burstConfetti(); hud();
    setTimeout(()=>{
      taskOv.hidden=true;
      if(activeBubble){ burstRing(activeBubble.x,activeBubble.y,activeBubble.r);
        activeBubble.el.classList.add("pop");
        const bb=activeBubble;
        setTimeout(()=>{ removeBubble(bb); afterRemove(); if(end.hidden){ paused=false; } },450);
        beep(300,.12,"square",0,900); }
      activeBubble=null;
    },700);
  } else {
    btn.classList.add("bad");
    optsEl.querySelectorAll(".opt-btn").forEach(x=>{ if(x.textContent===t.c) x.classList.add("good"); });
    state.combo=0; state.hearts--;
    tfb.textContent="❌ Correct: "+t.c; tfb.className="err";
    beep(220,.25,"sawtooth",0,110); hud();
    setTimeout(()=>{
      taskOv.hidden=true;
      if(activeBubble){ activeBubble.el.classList.add("pop");
        const bb=activeBubble;
        setTimeout(()=>{ removeBubble(bb); afterRemove(); if(end.hidden){ paused=false; } },450); }
      activeBubble=null;
    },1200);
  }
}
function start(){
  state.score=0; state.combo=0; state.hearts=3; state.solved=0;
  bubbles.forEach(b=>b.el.remove()); bubbles=[];
  measure();
  menu.hidden=true; end.hidden=true; taskOv.hidden=true;
  shuffle(TASKS.map((_,i)=>i)).forEach(i=>spawnBubble(i));
  paused=false; hud(); startAmbient();
}
function endGame(win){
  paused=true; stopAmbient();
  if(state.score>state.best){ state.best=state.score; saveBest(); }
  $("#end-title").textContent=win?"🏆 You win!":"Game over!";
  $("#end-text").textContent=win?"All "+WIN+" solved — amazing!":"Keep practising — you can do it!";
  $("#end-stats").textContent=state.score+" points • "+state.best+" best • "+state.solved+" solved";
  end.hidden=false; hud();
  if(win){ try{ window.parent.postMessage({type:"minigame-won", id:"bubble"}, "*"); }catch(e){} }
}

$("#btn-start").addEventListener("click",start);
$("#btn-again").addEventListener("click",start);
$("#btn-sound").addEventListener("click",()=>{ muted=!muted; $("#btn-sound").textContent=muted?"🔇":"🔊"; });

/* ================= ELEMENTS / STATE ================= */
const $ = s => document.querySelector(s);

      plaqueEl = $("#plaque"), feedbackEl = $("#feedback"),

/* ================= SOUND ================= */
let audioCtx = null, muted = false;
function beep(f, d, type, when, slide){
  if (muted) return;
  try{
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const t = audioCtx.currentTime + (when || 0);
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type || "sine"; o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + d);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.2, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g); g.connect(audioCtx.destination); o.start(t); o.stop(t + d + 0.05);
  }catch(e){}
}
const sJump = () => beep(300, .18, "square", 0, 600);

/* ================= UTILS / SKINS ================= */
function shuffle(a){ for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function loadBest(){ try { state.best = +localStorage.getItem(CONFIG.STORAGE_KEY) || 0; } catch(e){ state.best = 0; } }
function saveBest(){ try { localStorage.setItem(CONFIG.STORAGE_KEY, state.best); } catch(e){} }
function removeWhite(img){
  try{
    const c = document.createElement("canvas");
    c.width = img.naturalWidth; c.height = img.naturalHeight;
    const ctx = c.getContext("2d"); ctx.drawImage(img, 0, 0);
    const d = ctx.getImageData(0, 0, c.width, c.height), p = d.data;
    for (let i = 0; i < p.length; i += 4){
      if (p[i] > 235 && p[i+1] > 235 && p[i+2] > 235) p[i+3] = 0;
      else if (p[i] > 210 && p[i+1] > 210 && p[i+2] > 210) p[i+3] = 110;
    }
    ctx.putImageData(d, 0, 0);
    return { src: c.toDataURL(), clean: true };
  }catch(e){ return { src: img.src, clean: false }; }
}
/* Пробуем пути по очереди: images/… затем корень */
function loadSkin(urls, useCut){
  return new Promise(res => {
    let i = 0;
    const next = () => {
      if (i >= urls.length) return res(null);
      const im = new Image();
      im.onload = () => res(useCut ? removeWhite(im) : { src: im.src, clean: true });
      im.onerror = () => { i++; next(); };
      im.src = urls[i];
    };
    next();
  });
}
function applySkins(){
  loadSkin(CONFIG.SKINS.background, false).then(r => {
    if (r) gameEl.style.backgroundImage = "url('" + r.src + "')";
  });
  loadSkin(CONFIG.SKINS.hero, true).then(r => {
    if (!r) return;

    document.querySelectorAll(".plat-body").forEach(b => { b.style.backgroundImage = "none"; });
    document.querySelectorAll(".plat-skin").forEach(el => {
      el.style.backgroundImage = "url('" + r.src + "')";
      el.classList.toggle("blend", !r.clean);

}

/* ================= METRICS / WORLD ================= */
function computeMetrics(){
  W = gameEl.clientWidth; H = gameEl.clientHeight;

  ROW_GAP = Math.max(220, Math.round(H * 0.36));
  gameEl.style.setProperty("--platW", platW + "px");
}
function stand(p){ return { x: p.wx - heroW / 2, y: p.wy - heroH + 34 }; }
function makePlatform(wx, wy, slot, label){
  const el = document.createElement("div");
  el.className = "plat";
  const body = document.createElement("button");
  body.type = "button"; body.className = "plat-body";
  const skinDiv = document.createElement("div");
  skinDiv.className = "plat-skin";
  body.appendChild(skinDiv);
  body.insertAdjacentHTML("beforeend", '<span class="platform-label"></span><span class="key-hint"></span>');
  el.appendChild(body);
  gameEl.appendChild(el);
  const skin = window.__platSkin;
  if (skin){
    skinDiv.style.backgroundImage = "url('" + skin.src + "')";
    skinDiv.classList.toggle("blend", !skin.clean);
    body.style.backgroundImage = "none";
  }
  const p = { el, body, wx, wy, slot, w: platW, alive: true };
  body.querySelector(".platform-label").textContent = label || "";
  body.addEventListener("click", () => { if (p.slot >= 0) choose(p.slot); });
  allPlats.push(p);
  return p;
}
function fall(p){
  p.alive = false;
  p.body.classList.add("fall");
  setTimeout(() => { p.el.remove(); allPlats = allPlats.filter(q => q !== p); }, 850);
}
function crackFall(p){
  p.body.classList.add("crack");
  setTimeout(() => p.body.classList.add("fall"), 260);
  p.alive = false;
  setTimeout(() => { p.el.remove(); allPlats = allPlats.filter(q => q !== p); }, 1100);
}

/* ================= CAMERA + HERO LOOP ================= */
function easeInOutSine(k){ return -(Math.cos(Math.PI * k) - 1) / 2; }
function loop(t){
  if (current){
    cam.x += (current.wx - cam.x) * 0.09;
    cam.y += ((current.wy - H * 0.12) - cam.y) * 0.09;
  }
  for (const p of allPlats){
    const sx = p.wx - cam.x + W / 2 - p.w / 2;
    const sy = p.wy - cam.y + H / 2;
    p.el.style.transform = "translate(" + sx + "px," + sy + "px)";
  }
  if (jump){
    const k = Math.min(1, (t - jump.t0) / jump.dur);
    if (k >= 0){
      const e = easeInOutSine(Math.max(0, k));
      hero.wx = jump.from.x + (jump.to.x - jump.from.x) * e;
      hero.wy = jump.from.y + (jump.to.y - jump.from.y) * e - Math.sin(Math.PI * e) * jump.arc;
      const st = Math.sin(Math.PI * Math.max(0, k));
      hero.sx = 1 - 0.08 * st; hero.sy = 1 + 0.12 * st;
      if (k >= 1){
        jump = null; hero.wx = jumpTo.x; hero.wy = jumpTo.y;
        squashT0 = t;
        const cb = jumpCb; jumpCb = null; cb && cb();
      }
    }
  } else if (squashT0){
    const q = Math.min(1, (t - squashT0) / 200);
    const s = Math.sin(Math.PI * q);
    hero.sx = 1 + 0.16 * s; hero.sy = 1 - 0.14 * s;
    if (q >= 1){ squashT0 = 0; hero.sx = 1; hero.sy = 1; }
  } else if (state.screen === "play"){
    const b = Math.abs(Math.sin((t || 0) / 260));
    hero.sy = 1 + b * 0.05; hero.sx = 1 - b * 0.03;
  }
  let hx = hero.wx - cam.x + W / 2;
  let hy = hero.wy - cam.y + H / 2;
  if (!jump && !squashT0 && state.screen === "play") hy -= Math.abs(Math.sin((t || 0) / 260)) * 6;
  heroEl.style.transform = "translate(" + hx + "px," + hy + "px) scale(" + hero.sx + "," + hero.sy + ")";
  requestAnimationFrame(loop);
}
function startJump(from, to, dur, arc, cb){
  jump = { t0: performance.now() + 80, dur, from, to, arc };
  jumpTo = to; jumpCb = cb;
  hero.sx = 1.18; hero.sy = 0.82;
}

/* ================= FX / HUD ================= */
function confetti(){
  const colors = ["#FF8CC6","#8F7BEB","#8FE8F0","#FFD34D","#8FD14F","#fff"];
  for (let i = 0; i < 36; i++){
    const c = document.createElement("span");
    c.className = "confetto";
    const s = 6 + Math.random() * 8;
    c.style.cssText = "left:" + (Math.random()*100) + "%;top:-20px;width:" + s + "px;height:" + s + "px;background:" + colors[i % colors.length];
    gameEl.appendChild(c);
    c.animate(
      [{ transform: "translateY(0) rotate(0)", opacity: 1 },
       { transform: "translateY(" + (gameEl.clientHeight + 40) + "px) rotate(" + (360 + Math.random()*360) + "deg)", opacity: .9 }],
      { duration: 900 + Math.random() * 700, easing: "ease-in" }
    ).onfinish = () => c.remove();
  }
}
function popup(p, text){
  const sx = p.wx - cam.x + W / 2, sy = p.wy - cam.y + H / 2;
  const el = document.createElement("div");
  el.className = "popup"; el.textContent = text;
  el.style.left = (sx - 20) + "px"; el.style.top = (sy - 10) + "px";
  gameEl.appendChild(el);
  el.animate([{ transform: "translateY(0)", opacity: 1 }, { transform: "translateY(-60px)", opacity: 0 }],
    { duration: 900 }).onfinish = () => el.remove();
}
function showFeedback(t){ feedbackEl.textContent = t; feedbackEl.hidden = false; }
function renderHearts(){ heartsEl.textContent = "💖".repeat(state.hearts) + "🤍".repeat(Math.max(0, CONFIG.HEARTS - state.hearts)); }
function updateHud(){

  wordEl.textContent = CONFIG.WIN_WORDS > 0
    ? "Word " + Math.min(state.words + 1, CONFIG.WIN_WORDS) + "/" + CONFIG.WIN_WORDS
    : "Word " + (state.words + 1);
