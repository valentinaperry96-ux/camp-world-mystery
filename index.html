<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Camp World Mystery: The Missing Red Notebook</title>
<style>
  :root{
    --deep:#5B4BC4; --peri:#8F7BEB; --lav:#B9A7F2; --ink:#33268F;
    --pink:#F7A8D8; --pink-deep:#E46BB4; --ice:#BFE6F7; --ice-deep:#7FB6E8;
    --lime:#8FD14F; --lime-deep:#4E9A1F; --red:#E5484D; --gold:#FFD34D;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; overflow:hidden; color:var(--ink);
    font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;
    background:linear-gradient(180deg,#B79CFF 0%,#EFD3F7 45%,#8F7BEB 100%);
  }
  body::before{
    content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
    background:
      radial-gradient(2px 2px at 15% 25%,#fff 50%,transparent 55%),
      radial-gradient(2px 2px at 80% 15%,#fff 50%,transparent 55%),
      radial-gradient(3px 3px at 65% 70%,#FFE3F7 50%,transparent 55%),
      radial-gradient(2px 2px at 30% 80%,#fff 50%,transparent 55%),
      radial-gradient(2px 2px at 90% 60%,#fff 50%,transparent 55%),
      repeating-linear-gradient(0deg,rgba(255,255,255,.12) 0 1px,transparent 1px 70px),
      repeating-linear-gradient(90deg,rgba(255,255,255,.12) 0 1px,transparent 1px 70px);
  }
  [hidden]{display:none !important;}
  .visually-hidden{position:absolute;width:1px;height:1px;margin:-1px;clip-path:inset(50%);overflow:hidden;white-space:nowrap;}

  #app{height:100dvh;}
  .screen{height:100%; max-width:1200px; margin:0 auto; padding:12px; display:flex; flex-direction:column; min-height:0;}

  .glass{
    background:linear-gradient(180deg,rgba(255,255,255,.95),rgba(233,219,255,.9));
    border:3px solid var(--deep); border-radius:22px;
    box-shadow:inset 0 0 0 3px #fff, inset 0 4px 12px rgba(255,255,255,.9), 0 10px 26px rgba(91,75,196,.4);
  }

  h1,h2,h3{margin:0; line-height:1.15;}
  .title-y2k{
    background:linear-gradient(180deg,#fff 0%,#FFD9F0 35%,#B9A7F2 70%,#8F7BEB 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    -webkit-text-stroke:1.5px var(--deep);
    filter:drop-shadow(0 2px 0 rgba(255,255,255,.75)) drop-shadow(0 5px 10px rgba(143,123,235,.45));
    font-weight:900; letter-spacing:.5px;
  }

  .btn{
    min-height:44px; padding:10px 18px; border-radius:999px; cursor:pointer;
    border:2px solid var(--deep); font:inherit; font-weight:800; color:var(--ink);
    text-transform:uppercase; letter-spacing:.05em;
    background:linear-gradient(180deg,#fff 0%,#E4D6FF 40%,#A98BFF 100%);
    box-shadow:inset 0 2px 3px #fff, inset 0 -3px 6px rgba(91,75,196,.3), 0 3px 0 var(--deep), 0 7px 14px rgba(91,75,196,.35);
    transition:transform .15s ease;
  }
  .btn:hover:not(:disabled){transform:translateY(-2px) scale(1.02);}
  .btn:disabled{opacity:.55; cursor:not-allowed;}
  .btn-lime{
    color:#2C6B12; border-color:var(--lime-deep);
    background:linear-gradient(180deg,#fff 0%,#E4FFB0 40%,#8FD14F 100%);
    box-shadow:inset 0 2px 3px #fff, inset 0 -3px 6px rgba(78,154,31,.3), 0 3px 0 var(--lime-deep), 0 7px 14px rgba(90,170,40,.35);
  }
  .btn-candy{
    color:#8C1D54; border-color:var(--pink-deep);
    background:linear-gradient(180deg,#fff 0%,#FFD9F0 40%,#FF8CC6 100%);
    box-shadow:inset 0 2px 3px #fff, inset 0 -3px 6px rgba(228,107,180,.3), 0 3px 0 var(--pink-deep), 0 7px 14px rgba(255,122,184,.4);
  }
  .btn-ghost{
    color:#1D5E8C; border-color:var(--ice-deep);
    background:linear-gradient(180deg,rgba(255,255,255,.9),rgba(191,230,247,.75));
    box-shadow:inset 0 2px 3px #fff, 0 3px 0 var(--ice-deep), 0 6px 12px rgba(127,182,232,.35);
  }
  .btn-big{min-height:54px; padding:12px 42px; font-size:1.15rem;}
  .btn:focus-visible,input:focus-visible,select:focus-visible,.map-location:focus-visible{outline:4px solid var(--pink); outline-offset:2px;}

  .topbar{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:10px;}
  .topbar h1{flex:1; min-width:140px; font-size:clamp(1.05rem,2.6vw,1.5rem);}

  /* ============ START ============ */
  #screen-start{align-items:center; justify-content:center;}
  .start-hero{position:relative; width:min(880px,100%); flex:1; min-height:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; padding:8px;}
  .hero-deco{position:absolute; inset:0; pointer-events:none; overflow:hidden;}
  .orb{position:absolute; border-radius:50%;
    background:radial-gradient(circle at 30% 25%, rgba(255,255,255,.95), rgba(255,255,255,.25) 45%, rgba(185,167,242,.15) 70%);
    box-shadow:0 0 18px rgba(255,255,255,.6), inset 0 0 12px rgba(255,255,255,.8);
    animation:float 7s ease-in-out infinite;}
  .orb-1{width:70px;height:70px; left:5%; top:10%;}
  .orb-2{width:44px;height:44px; right:9%; top:20%; animation-delay:1.2s;}
  .orb-3{width:28px;height:28px; left:14%; bottom:16%; animation-delay:2s;}
  .ring{position:absolute; right:5%; bottom:7%; width:110px; height:110px; border-radius:50%;
    border:10px solid rgba(255,255,255,.85);
    box-shadow:0 0 22px rgba(143,123,235,.7), inset 0 0 14px rgba(185,167,242,.8);
    animation:float 9s ease-in-out infinite;}
  .spark{position:absolute; color:#fff; text-shadow:0 0 10px #FFD9F0, 0 0 20px #8F7BEB; animation:twinkle 2.6s ease-in-out infinite;}
  .s-1{left:11%; top:7%; font-size:22px;}
  .s-2{right:15%; top:9%; font-size:16px; animation-delay:.7s;}
  .s-3{left:8%; bottom:24%; font-size:18px; animation-delay:1.4s;}
  .s-4{right:10%; bottom:28%; font-size:26px; animation-delay:2s;}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
  @keyframes twinkle{0%,100%{opacity:.25; transform:scale(.8)}50%{opacity:1; transform:scale(1.15)}}

  .hero-title{
    margin:0; text-align:center; text-transform:uppercase;
    font-size:clamp(1.8rem,5.2vw,3.6rem); font-weight:900; letter-spacing:.04em;
    background:linear-gradient(100deg,#fff 0%,#FFD9F0 20%,#B9A7F2 40%,#8FE8F0 60%,#FFD9F0 80%,#fff 100%);
    background-size:220% 100%;
    -webkit-background-clip:text; background-clip:text; color:transparent;
    -webkit-text-stroke:1.5px var(--deep);
    filter:drop-shadow(0 2px 0 #fff) drop-shadow(0 6px 14px rgba(91,75,196,.55));
    animation:holo 7s linear infinite;
  }
  @keyframes holo{0%{background-position:0% 50%}100%{background-position:220% 50%}}

  .hero-sub{margin:0; font-weight:800; color:var(--deep);
    background:rgba(255,255,255,.75); padding:6px 16px; border-radius:999px;
    border:2px solid var(--peri); box-shadow:inset 0 0 0 2px #fff;}

  .hero-frame{position:relative; width:min(100%, 780px); margin:0 auto; border-radius:26px; border:4px solid #fff; outline:3px solid var(--deep);
    overflow:hidden; box-shadow:0 14px 34px rgba(91,75,196,.5), inset 0 0 0 2px rgba(255,255,255,.8);
    display:flex; align-items:center; justify-content:center;
    background:linear-gradient(180deg,rgba(255,255,255,.35),rgba(185,167,242,.25));}
  .hero-frame img{display:block; max-width:100%; width:auto; height:auto; max-height:46vh; object-fit:contain;}
  .hero-frame::after{content:""; position:absolute; inset:0;
    background:linear-gradient(115deg, transparent 35%, rgba(255,255,255,.55) 50%, transparent 65%);
    transform:translateX(-120%); animation:shine 4.5s ease-in-out infinite;}
  @keyframes shine{0%{transform:translateX(-120%)}55%,100%{transform:translateX(120%)}}

  .start-text{width:min(780px,100%); padding:10px 20px; text-align:center;
    background:rgba(255,255,255,.82); border:2px dashed var(--peri); border-radius:18px;
    columns:2; column-gap:26px;}
  .start-text p{margin:4px 0; font-weight:700; font-size:.95rem; break-inside:avoid;}

  /* ============ MAP ============ */
  .map-status{padding:8px 14px; border-radius:999px; font-weight:800; margin-bottom:10px;
    background:rgba(255,255,255,.9); border:2px solid var(--deep);
    box-shadow:inset 0 0 0 2px #fff, 0 3px 0 rgba(91,75,196,.35);}
  .map-wrap{position:relative; flex:1; min-height:0;}
  .map-board{position:absolute; inset:0; border-radius:24px; overflow:hidden;
    border:3px solid var(--deep); background-color:#CBB8F5; background-size:cover; background-position:center;
    box-shadow:inset 0 0 0 3px #fff, 0 12px 30px rgba(91,75,196,.45);}
  .map-location{position:absolute; transform:translate(-50%,-50%); width:26%;
    min-height:64px; padding:8px 10px; border-radius:999px; cursor:pointer;
    border:3px solid var(--deep); font:inherit; font-weight:800; color:var(--ink);
    background:linear-gradient(180deg,rgba(255,255,255,.95),rgba(247,168,216,.85));
    box-shadow:inset 0 0 0 2px #fff, 0 4px 0 var(--deep), 0 8px 16px rgba(91,75,196,.35);
    display:grid; gap:2px; justify-items:center;}
  .map-location--visited{background:linear-gradient(180deg,#fff,#BDEBFF);}
  .map-location--completed{background:linear-gradient(180deg,#F2FFD1,#B8EC74);}
  .map-status-label{font-size:.75rem; font-weight:700; opacity:.8;}
  #btn-final{position:absolute; left:50%; top:47%; transform:translate(-50%,-50%); width:30%; margin:0;}

  /* ============ LOCATION ============ */
  .scene-banner{position:relative; height:37vh; min-height:215px; margin-bottom:10px; flex:none;
    border-radius:24px; overflow:hidden; border:3px solid var(--deep);
    background-size:cover; background-position:center;
    box-shadow:inset 0 0 0 3px #fff, 0 12px 26px rgba(91,75,196,.4);}
  .character-portrait{position:absolute; top:12px; left:12px; width:84px; height:84px; object-fit:cover;
    border-radius:50%; border:4px solid #fff; background:#fff;
    box-shadow:0 0 0 3px var(--deep), 0 8px 18px rgba(51,38,143,.5);}
  .character-card{position:absolute; left:12px; bottom:12px; padding:8px 16px; text-align:left;}
  .character-card h2{font-size:1rem;}
  .character-card p{margin:2px 0 0; font-size:.82rem; font-weight:600;}

  .right-panel{flex:1; min-height:0; display:flex; flex-direction:column; padding:12px; overflow:hidden;}
  #dialogue-body{min-height:0;}
  .right-head{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:8px;}
  .bubble{padding:8px 14px; border-radius:18px 18px 18px 6px; min-height:46px; margin-bottom:8px;
    background:linear-gradient(180deg,#fff,#F3E8FF); border:3px solid var(--peri);
    box-shadow:0 4px 0 rgba(91,75,196,.3); font-weight:700;}
  .questions-list{display:grid; gap:6px;}
  .q-row{display:grid; grid-template-columns:200px 1fr 84px; gap:8px; align-items:center;}
  .q-hint{white-space:normal; text-align:center; line-height:1.15;}
  .chip{padding:6px 12px; border-radius:999px; font-weight:800; font-size:.82rem; white-space:nowrap;
    background:#fff; border:2px dashed var(--peri); color:var(--deep); box-shadow:0 2px 0 rgba(91,75,196,.2);}
  .q-input{min-height:44px; width:100%; padding:8px 16px; border-radius:999px;
    border:2px solid var(--peri); background:rgba(255,255,255,.95);
    font:inherit; font-weight:600; color:var(--ink); box-shadow:inset 0 2px 6px rgba(143,123,235,.3);}
  .q-input:disabled{background:#EAFBE0; border-color:var(--lime-deep);}
  .q-ask{min-width:74px;}
  .dialogue-feedback{min-height:22px; margin-top:8px; font-weight:800;}
  .dialogue-feedback--error{color:var(--red);}

  .minigame-container{flex:1; min-height:0; overflow:auto; display:flex; flex-direction:column;}
  .minigame{padding:10px; border-radius:18px;
    background:rgba(191,230,247,.5); backdrop-filter:blur(6px);
    border:3px solid var(--ice-deep); box-shadow:inset 0 0 0 2px #fff;}
  .minigame h3{font-size:1rem; margin-bottom:6px;}
  .minigame__help{margin:4px 0; font-size:.85rem; font-weight:600; opacity:.8;}
  .minigame__actions{display:flex; gap:8px; flex-wrap:wrap; margin-top:8px;}

  .mg-frame-wrap{position:relative; width:100%; height:min(80vh, 760px); min-height:540px;
    border-radius:18px; overflow:hidden; border:3px solid var(--deep); margin-top:6px;
    box-shadow:inset 0 0 0 2px #fff, 0 10px 22px rgba(91,75,196,.4);
    background:linear-gradient(180deg,#B79CFF 0%,#EFD3F7 45%,#8F7BEB 100%);}
  .mg-frame-wrap iframe{width:100%; height:100%; border:none; display:block;}

  /* Notebook */
  .overlay{position:fixed; inset:0; z-index:60; display:flex; align-items:center; justify-content:center;
    padding:14px; background:rgba(51,38,143,.5); backdrop-filter:blur(4px);}
  .notebook-panel{width:min(760px,100%); max-height:92dvh; overflow:auto; padding:16px;
    background-size:100% 100%; background-color:rgba(243,232,255,.95);}
  .clue-card{display:grid; grid-template-columns:auto 1fr; gap:10px; align-items:center; padding:8px; margin-bottom:8px;
    background:#fff; border:2px solid var(--peri); border-radius:16px;}
  .clue-card--key{border-color:var(--gold); box-shadow:0 0 0 3px rgba(255,211,77,.45);}
  .clue-icon-img{width:52px; height:52px; object-fit:cover; border-radius:12px; border:2px solid #fff;
    box-shadow:0 0 0 2px var(--deep), 0 4px 10px rgba(91,75,196,.35);}
  .note-entry{padding:8px 10px; margin-bottom:8px; background:#fff; border:2px dashed var(--peri); border-radius:12px; font-weight:600;}

  #notebook-progress,
  .notebook-panel h3,
  #notebook-clues > p,
  #notebook-notes > p{
    background:#fff; border:2px dashed var(--peri); border-radius:12px;
    padding:6px 12px; margin:6px 0; font-weight:800;
  }

  /* Final / victory */
  .center-card{width:min(760px,100%); margin:auto; padding:16px; max-height:100%; overflow:auto;}
  .final-options{display:grid; gap:8px; margin:12px 0;}
  .suspect-option{text-align:left;}
  .suspect-option--selected{background:linear-gradient(180deg,#FFE3F1,#FFA8D2);}
  .final-message{min-height:26px; font-weight:800;}
  .final-message--error{color:var(--red);}
  .final-message--locked{color:var(--deep);}
  .final-hint{margin-top:8px; padding:10px; border-radius:14px; background:#FFF6D8; border:2px solid var(--gold); font-weight:700;}
  .victory-panel img{display:block; width:100%; height:auto; max-height:56vh; object-fit:contain;
    border-radius:16px; border:3px solid #fff; box-shadow:0 0 0 3px var(--deep);
    background:rgba(255,255,255,.4);}
  .global-notification{position:fixed; left:50%; bottom:14px; transform:translateX(-50%); z-index:100;
    max-width:92%; padding:10px 18px; border-radius:999px;
    background:linear-gradient(180deg,#FF8CC6,#8F7BEB); color:#fff; font-weight:800;
    border:2px solid #fff; box-shadow:0 6px 16px rgba(91,75,196,.5);}

  .loc--minigame .scene-banner{height:12vh; min-height:90px;}
  .loc--minigame .character-portrait{width:56px; height:56px;}
  .loc--minigame .character-card{padding:6px 12px;}
  .loc--minigame .minigame{padding:8px;}
  .loc--minigame .mg-frame-wrap{height:min(84vh, 800px); min-height:580px;}
  @media (max-width:820px){
    .start-text{columns:1;}
    .scene-banner{height:30vh; min-height:180px;}
    .character-portrait{width:64px; height:64px;}
    .map-location{width:34%;}
    #btn-final{width:44%;}
    .q-row{grid-template-columns:1fr auto;}
    .q-hint{grid-column:1 / -1; justify-self:start;}
  }
  @media (max-height:640px){
    .hero-sub{display:none;}
    .scene-banner{height:18vh; min-height:120px;}
    .bubble{min-height:40px;}
    .hero-frame img{max-height:34vh;}
    .mg-frame-wrap{height:min(72vh, 600px); min-height:480px;}
  }
</style>
</head>
<body>
<noscript>Please enable JavaScript to play this game.</noscript>

<main id="app">
  <section id="screen-start" class="screen" hidden>
    <div class="start-hero">
      <div class="hero-deco" aria-hidden="true">
        <span class="orb orb-1"></span><span class="orb orb-2"></span><span class="orb orb-3"></span>
        <span class="ring"></span>
        <span class="spark s-1">✦</span><span class="spark s-2">✧</span>
        <span class="spark s-3">✦</span><span class="spark s-4">✧</span>
      </div>
      <h1 id="start-title" class="hero-title"></h1>
      <p class="hero-sub">🕵️✨ A holographic detective quest for English learners</p>
      <div class="hero-frame"><img id="start-image" alt="Camp World"></div>
      <div id="start-text" class="start-text"></div>
      <button id="btn-start" type="button" class="btn btn-candy btn-big" data-action="start"></button>
    </div>
  </section>

  <section id="screen-map" class="screen" hidden>
    <div class="topbar">
      <h1 class="title-y2k">✨ Camp World Map</h1>
      <button id="btn-open-notebook-map" type="button" class="btn btn-ghost" data-action="open-notebook"></button>
    </div>
    <div id="map-status" class="map-status" aria-live="polite"></div>
    <div class="map-wrap">
      <div id="map-board" class="map-board"></div>
      <button id="btn-final" type="button" class="btn btn-candy" data-action="open-final"></button>
    </div>
  </section>

  <section id="screen-location" class="screen" hidden>
    <div class="topbar">
      <button id="btn-return-map" type="button" class="btn btn-ghost" data-action="go-map"></button>
      <h1 id="location-title" class="title-y2k"></h1>
      <button id="btn-open-notebook-location" type="button" class="btn btn-ghost" data-action="open-notebook"></button>
    </div>

    <div id="character-bg" class="scene-banner">
      <img id="character-portrait" class="character-portrait" alt="">
      <div class="glass character-card">
        <h2 id="character-name"></h2>
        <p id="character-role"></p>
      </div>
    </div>

    <section class="glass right-panel">
      <div class="right-head">
        <h2 class="title-y2k">💬 Dialogue</h2>
        <button id="btn-minigame-toggle" type="button" class="btn" data-action="toggle-minigame"></button>
      </div>

      <div id="dialogue-body">
        <div id="dialogue-answer" class="bubble" aria-live="polite"></div>
        <div id="questions-list" class="questions-list"></div>
        <div id="dialogue-feedback" class="dialogue-feedback" aria-live="polite"></div>
      </div>

      <div id="minigame-container" class="minigame-container" hidden></div>
    </section>
  </section>

  <section id="screen-final" class="screen" hidden>
    <div class="glass center-card">
      <div class="topbar">
        <h1 id="final-question" class="title-y2k"></h1>
        <button id="btn-final-return" type="button" class="btn btn-ghost" data-action="go-map"></button>
      </div>
      <div id="final-options" class="final-options"></div>
      <button id="btn-confirm-accusation" type="button" class="btn btn-candy" data-action="confirm-accusation"></button>
      <div id="final-message" class="final-message" aria-live="polite"></div>
      <div id="final-hint" class="final-hint" hidden></div>
    </div>
  </section>

  <section id="screen-victory" class="screen" hidden>
    <div class="glass center-card victory-panel">
      <h1 id="victory-title" class="title-y2k"></h1>
      <img id="victory-image" alt="Celebration at Camp World">
      <p id="victory-text"></p>
      <p id="victory-explanation"></p>
      <button id="btn-victory-return" type="button" class="btn btn-lime" data-action="go-map"></button>
    </div>
  </section>
</main>

<div id="overlay-notebook" class="overlay" hidden>
  <div class="notebook-panel glass" role="dialog" aria-modal="true" aria-labelledby="notebook-title">
    <h2 id="notebook-title" class="title-y2k"></h2>
    <p id="notebook-progress"></p>
    <h3 id="notebook-clues-title"></h3>
    <div id="notebook-clues"></div>
    <h3 id="notebook-notes-title"></h3>
    <div id="notebook-notes"></div>
    <button id="btn-close-notebook" type="button" class="btn" data-action="close-notebook"></button>
  </div>
</div>

<div id="aria-announcer" class="visually-hidden" aria-live="polite"></div>
<div id="global-notification" class="global-notification" hidden></div>

<script>
/* ================= GAME_DATA ================= */
const GAME_DATA = {
  meta: { title: "Camp World Mystery: The Missing Red Notebook", language: "en", level: "A1", age: "10-12" },

  startScreen: {
    title: "Camp World Mystery",
    image: "images/start_screen.png",
    text: "Welcome to Camp World!\nIt is Monday.\nThe red notebook is not here.\nIt is Mia's notebook.\nIt has names, dates and phone numbers.\nThe camp party is on Friday.\nWho has the notebook?\nAsk questions.\nFind clues.\nChoose the culprit.",
    button: "Start Investigation"
  },

  map: { image: "images/map_camp_world.png" },
  notebook: { background: "images/notebook_background.png" },

  ui: {
    caseNote: "Case: The red notebook is missing.",
    returnToMap: "⬅ Map", openNotebook: "📒 Notebook", closeNotebook: "Close Notebook",
    openMiniGame: "🎮 Mini-game", closeMiniGame: "Close Mini-game", miniGameCompleted: "Mini-game completed",
    chooseQuestion: "Type a question and press Ask!",
    greatJob: "Great job!", notQuite: "Not quite. Try again!",
    keyCluesMessage: "You have the key clues! You can choose the culprit.",
    keyProgress: "Key clues", lockedFinal: "You need more key clues.",
    accuseButton: "🔥 Accuse the culprit", accuse: "Accuse",

/* ================= STATE ================= */
const gameState = {
  currentScreen: "start", currentLocation: null,
  visitedLocations: [], collectedClues: [], notebookEntries: [],
  playerName: null, finalUnlocked: false, accusedCharacter: null, gameCompleted: false,
  askedQuestions: {}, questionAttempts: {}, miniGameCompleted: {},
  selectedSuspect: null, activeMiniGameId: null,
  miniGameOpen: false, finalNoteAdded: false
};
let notificationTimer = null;

/* ================= UTILS ================= */
function $(s){ return document.querySelector(s); }
function $$(s){ return Array.from(document.querySelectorAll(s)); }
function getLocation(id){ return GAME_DATA.locations.find(l => l.id === id); }
function getCharacter(id){ return GAME_DATA.characters.find(c => c.id === id); }
function getClue(id){ return GAME_DATA.clues.find(c => c.id === id); }
function hasClue(id){ return gameState.collectedClues.includes(id); }
function getKeyClueCount(){ return GAME_DATA.final.requiredKeyClues.filter(hasClue).length; }
function announce(m){ $("#aria-announcer").textContent = m; }

function normalizeQuestion(text){
  return (text || "").toLowerCase()
    .replace(/[’‘`´]/g, "'")
    .replace(/[^a-z0-9\s']/gi, "")
    .replace(/'/g, "")
    .replace(/\s+/g, " ")
    .trim();
}

function showNotification(m){
  const n = $("#global-notification");
  n.textContent = m; n.hidden = false;
  clearTimeout(notificationTimer);
  notificationTimer = setTimeout(() => { n.hidden = true; }, 3500);
}

/* ================= NAVIGATION ================= */
function showScreen(name){
  $$(".screen").forEach(s => { s.hidden = true; });
  const t = $("#screen-" + name);
  if (t){ t.hidden = false; gameState.currentScreen = name; }
}

function startGame(){ addNote(GAME_DATA.ui.caseNote); renderMap(); showScreen("map"); }

function goToMap(){
  gameState.currentLocation = null;
  closeMiniGame();
  renderMap(); showScreen("map");
}

function openLocation(locationId){
  const location = getLocation(locationId);
  if (!location) return;
  gameState.currentLocation = locationId;
  if (!gameState.visitedLocations.includes(locationId)) gameState.visitedLocations.push(locationId);
  ensureLocationProgress(locationId);
  closeMiniGame();
  renderLocation();
  showScreen("location");
}

function ensureLocationProgress(id){
  if (!gameState.askedQuestions[id]) gameState.askedQuestions[id] = [false,false,false,false];
}

/* ================= START ================= */
function renderStart(){
  $("#start-title").textContent = GAME_DATA.startScreen.title;
  $("#start-image").src = GAME_DATA.startScreen.image;
  const box = $("#start-text"); box.innerHTML = "";
  GAME_DATA.startScreen.text.split("\n").forEach(line => {
    const p = document.createElement("p"); p.textContent = line; box.appendChild(p);
  });
  $("#btn-start").textContent = GAME_DATA.startScreen.button;
}

/* ================= MAP ================= */
function getLocationStatus(loc){
  if (hasClue(loc.keyClueId)) return "completed";
  if (gameState.visitedLocations.includes(loc.id)) return "visited";
  return "not-visited";
}

function renderMap(){
  const board = $("#map-board");
  board.style.backgroundImage = "url('" + GAME_DATA.map.image + "')";
  board.innerHTML = "";

  GAME_DATA.locations.forEach(loc => {
    const status = getLocationStatus(loc);
    let label = GAME_DATA.ui.notVisited;
    if (status === "visited") label = GAME_DATA.ui.visited;
    if (status === "completed") label = GAME_DATA.ui.completed;

    const b = document.createElement("button");
    b.type = "button";
    b.className = "map-location map-location--" + status;
    b.dataset.action = "open-location";
    b.dataset.location = loc.id;
    b.style.left = loc.mapPos.x + "%";
    b.style.top = loc.mapPos.y + "%";
    b.setAttribute("aria-label", loc.name + ", " + label);
    b.innerHTML = `<span>${loc.name}</span><span class="map-status-label">${label}</span>`;
    board.appendChild(b);
  });

  const fb = $("#btn-final"), ms = $("#map-status");
  const kc = getKeyClueCount(), rc = GAME_DATA.final.requiredKeyClues.length;

  if (gameState.gameCompleted){
    fb.disabled = true; fb.textContent = GAME_DATA.ui.caseSolved;
    ms.textContent = GAME_DATA.ui.victory;
  } else if (gameState.finalUnlocked){
    fb.disabled = false; fb.textContent = GAME_DATA.ui.accuseButton;
    ms.textContent = GAME_DATA.ui.keyCluesMessage;
  } else {
    fb.disabled = true; fb.textContent = GAME_DATA.ui.accuseButton;
    ms.textContent = GAME_DATA.ui.lockedFinal + " " + GAME_DATA.ui.keyProgress + ": " + kc + "/" + rc + ".";
  }
}

/* ================= LOCATION ================= */
function renderLocation(){
  const loc = getLocation(gameState.currentLocation);
  if (!loc) return;
  const ch = getCharacter(loc.characterId);
  const mg = GAME_DATA.miniGames[loc.miniGameId];
  const done = Boolean(gameState.miniGameCompleted[mg.id]);

  $("#location-title").textContent = loc.name;
  $("#character-bg").style.backgroundImage = "url('" + loc.image + "')";
  const portrait = $("#character-portrait");
  portrait.src = ch.image; portrait.alt = ch.name;
  $("#character-name").textContent = ch.name;
  $("#character-role").textContent = ch.role;

  $("#dialogue-answer").textContent = GAME_DATA.ui.chooseQuestion;
  $("#dialogue-feedback").textContent = "";
  renderQuestions();

  $("#btn-minigame-toggle").textContent = done ? "🎮 " + GAME_DATA.ui.miniGameCompleted : GAME_DATA.ui.openMiniGame;
}

function renderQuestions(){
  const loc = getLocation(gameState.currentLocation);
  if (!loc) return;
  const list = $("#questions-list"); list.innerHTML = "";

  loc.dialogue.questions.forEach((q, i) => {
    const done = Boolean(gameState.askedQuestions[loc.id][i]);
    const row = document.createElement("div");
    row.className = "q-row";
    row.innerHTML = `
      <span class="chip q-hint">${q.hint}</span>
      <input class="q-input" data-index="${i}" type="text" autocomplete="off"
        placeholder="Type your question..." ${done ? `value="${q.display}" disabled` : ""}>
      <button type="button" class="btn btn-lime q-ask" data-action="ask" data-index="${i}" ${done ? "disabled" : ""}>${done ? "✓" : "Ask"}</button>
    `;
    list.appendChild(row);
  });
}

function askQuestion(index){
  const loc = getLocation(gameState.currentLocation);
  if (!loc) return;
  const i = Number(index);
  const q = loc.dialogue.questions[i];
  if (gameState.askedQuestions[loc.id][i]) return;

  const input = document.querySelector(`.q-input[data-index="${i}"]`);
  const fb = $("#dialogue-feedback");
  const norm = normalizeQuestion(input.value);

  if (q.accepted.map(normalizeQuestion).includes(norm)){
    gameState.askedQuestions[loc.id][i] = true;
    $("#dialogue-answer").textContent = q.answer;
    fb.textContent = ""; fb.className = "dialogue-feedback";
    renderQuestions();
    if (q.clueId && !hasClue(q.clueId)) addClue(q.clueId);
    announce(q.answer);
  } else {
    const key = loc.id + "_" + i;
    gameState.questionAttempts[key] = (gameState.questionAttempts[key] || 0) + 1;
    fb.className = "dialogue-feedback dialogue-feedback--error";
    fb.textContent = gameState.questionAttempts[key] >= 2 ? "Hint: " + q.display : GAME_DATA.ui.notQuite;
  }
}

/* ================= MINI-GAMES (external files via iframe src) ================= */
function setToggleLabel(open){
  const loc = getLocation(gameState.currentLocation);
  const mg = GAME_DATA.miniGames[loc.miniGameId];
  const done = Boolean(gameState.miniGameCompleted[mg.id]);
  $("#btn-minigame-toggle").textContent = open
    ? GAME_DATA.ui.closeMiniGame
    : (done ? "🎮 " + GAME_DATA.ui.miniGameCompleted : GAME_DATA.ui.openMiniGame);
}

function toggleMiniGame(){
  if (gameState.miniGameOpen) closeMiniGame();
  else openMiniGame();
}

function openMiniGame(){
  const loc = getLocation(gameState.currentLocation);
  if (!loc) return;
  const mg = GAME_DATA.miniGames[loc.miniGameId];
  const container = $("#minigame-container");

  if (gameState.miniGameCompleted[mg.id]){
    const clue = getClue(mg.rewardClueId);
    container.innerHTML = `
      <div class="minigame">
        <p><strong>${GAME_DATA.ui.greatJob}</strong></p>
        <p>${clue.description}</p>
        <button type="button" class="btn btn-ghost" data-action="toggle-minigame">${GAME_DATA.ui.closeMiniGame}</button>
      </div>`;
  } else {
    gameState.activeMiniGameId = mg.id;
    renderMiniGame();
  }

  container.hidden = false;
  $("#dialogue-body").hidden = true;
  gameState.miniGameOpen = true;
  $("#screen-location").classList.add("loc--minigame");
  setToggleLabel(true);
}

function closeMiniGame(){
  const container = $("#minigame-container");
  container.hidden = true;
  container.innerHTML = "";
  $("#dialogue-body").hidden = false;
  gameState.miniGameOpen = false;
  gameState.activeMiniGameId = null;
  $("#screen-location").classList.remove("loc--minigame");
  if (gameState.currentLocation) setToggleLabel(false);
}

function renderMiniGame(){
  const mg = GAME_DATA.miniGames[gameState.activeMiniGameId];
  const container = $("#minigame-container");
  if (!mg || !container) return;
  const files = { claw: "claw_game.html", bubble: "bubble_drift.html", verbjump: "game1.html" };
  container.innerHTML = `
    <div class="minigame" style="padding:6px;">
      <h3>${mg.instruction}</h3>
      <p class="minigame__help">${mg.prompt}</p>
      <div class="mg-frame-wrap">
        <iframe allow="autoplay" title="${mg.instruction}"></iframe>
      </div>
      <div class="minigame__actions">
        <button type="button" class="btn btn-ghost" data-action="toggle-minigame">${GAME_DATA.ui.closeMiniGame}</button>
      </div>
    </div>`;
  const f = files[mg.type];
  if (f) container.querySelector("iframe").src = f;
}

/* Listen for mini-game win signals from the iframes */
window.addEventListener("message", function(ev){
  const data = ev.data;
  if (!data || typeof data !== "object") return;
  if (data.type !== "minigame-won") return;
  if (!gameState.miniGameOpen || !gameState.activeMiniGameId) return;
  const mg = GAME_DATA.miniGames[gameState.activeMiniGameId];
  if (!mg) return;
  if (data.id && data.id !== mg.type) return;
  if (gameState.miniGameCompleted[mg.id]) return;
  miniGameSuccess(mg);
});

function miniGameSuccess(mg){
  gameState.miniGameCompleted[mg.id] = true;
  addClue(mg.rewardClueId);
  const clue = getClue(mg.rewardClueId);
  const container = $("#minigame-container");
  container.innerHTML = `
    <div class="minigame">
      <p><strong>${GAME_DATA.ui.greatJob}</strong></p>
      <p>${clue.description}</p>
      <button type="button" class="btn btn-ghost" data-action="toggle-minigame">${GAME_DATA.ui.closeMiniGame}</button>
    </div>`;
  announce(GAME_DATA.ui.greatJob);
}

/* ================= NOTEBOOK ================= */
function openNotebook(){ renderNotebook(); $("#overlay-notebook").hidden = false; $("#btn-close-notebook").focus(); }
function closeNotebook(){ $("#overlay-notebook").hidden = true; }

function addNote(text){
  if (gameState.notebookEntries.some(e => e.text === text)) return;
  gameState.notebookEntries.push({ id: Date.now() + Math.random(), text });
  if (!$("#overlay-notebook").hidden) renderNotebook();
}

function addClue(clueId){
  if (hasClue(clueId)) return;
  const clue = getClue(clueId);
  gameState.collectedClues.push(clueId);
  addNote("New clue: " + clue.name + ".");
  showNotification(clue.name + " added to the Notebook.");
  updateFinalUnlock();
  if (!$("#overlay-notebook").hidden) renderNotebook();
}

function updateFinalUnlock(){
  const all = GAME_DATA.final.requiredKeyClues.every(hasClue);
  if (all && !gameState.finalUnlocked){
    gameState.finalUnlocked = true;
    if (!gameState.finalNoteAdded){ addNote(GAME_DATA.ui.keyCluesMessage); gameState.finalNoteAdded = true; }
    showNotification(GAME_DATA.ui.keyCluesMessage);
  }
  if (gameState.currentScreen === "map") renderMap();
}

function renderNotebook(){
  document.querySelector(".notebook-panel").style.backgroundImage = "url('" + GAME_DATA.notebook.background + "')";
  $("#notebook-progress").textContent = GAME_DATA.ui.keyProgress + ": " + getKeyClueCount() + "/" + GAME_DATA.final.requiredKeyClues.length;

  const cluesBox = $("#notebook-clues"), notesBox = $("#notebook-notes");
  cluesBox.innerHTML = ""; notesBox.innerHTML = "";

  if (gameState.collectedClues.length === 0){
    cluesBox.innerHTML = "<p>" + GAME_DATA.ui.noClues + "</p>";
  } else {
    gameState.collectedClues.forEach(id => {
      const c = getClue(id);
      const card = document.createElement("article");
      card.className = "clue-card" + (c.keyClue ? " clue-card--key" : "");
      card.innerHTML = `<img class="clue-icon-img" src="${c.image}" alt="">
        <div><h3>${c.name}${c.keyClue ? " ⭐" : ""}</h3><p>${c.description}</p></div>`;
      cluesBox.appendChild(card);
    });
  }

  if (gameState.notebookEntries.length === 0){
    notesBox.innerHTML = "<p>" + GAME_DATA.ui.noNotes + "</p>";
  } else {
    gameState.notebookEntries.forEach(e => {
      const n = document.createElement("div");
      n.className = "note-entry"; n.textContent = e.text;
      notesBox.appendChild(n);
    });
  }
}

/* ================= FINAL ================= */
function openFinalScreen(){
  if (!gameState.finalUnlocked || gameState.gameCompleted) return;
  gameState.selectedSuspect = null;
  renderFinalScreen();
  showScreen("final");
}

function renderFinalScreen(){
  $("#final-question").textContent = GAME_DATA.ui.accusationQuestion;
  $("#btn-confirm-accusation").textContent = GAME_DATA.ui.accuse;
  $("#btn-final-return").textContent = GAME_DATA.ui.returnToMap;
  $("#final-message").textContent = ""; $("#final-message").className = "final-message";
  $("#final-hint").hidden = true;
  renderFinalOptions();
}

function renderFinalOptions(){
  const box = $("#final-options"); box.innerHTML = "";
  GAME_DATA.characters.forEach(ch => {
    const sel = gameState.selectedSuspect === ch.id;
    const b = document.createElement("button");
    b.type = "button";
    b.className = "btn suspect-option" + (sel ? " suspect-option--selected" : "");
    b.dataset.action = "select-suspect"; b.dataset.character = ch.id;
    b.textContent = ch.name;
    box.appendChild(b);
  });
}

function selectSuspect(id){
  gameState.selectedSuspect = id;
  $("#final-message").textContent = ""; $("#final-message").className = "final-message";
  $("#final-hint").hidden = true;
  renderFinalOptions();
}

function confirmAccusation(){
  const m = $("#final-message"), h = $("#final-hint");
  if (!gameState.finalUnlocked){ m.textContent = GAME_DATA.ui.lockedFinal; m.className = "final-message final-message--locked"; return; }
  if (!gameState.selectedSuspect){ m.textContent = GAME_DATA.ui.selectCharacter; m.className = "final-message final-message--locked"; return; }

  if (gameState.selectedSuspect === GAME_DATA.final.culpritId){
    gameState.gameCompleted = true;
    gameState.accusedCharacter = gameState.selectedSuspect;
    showVictoryScreen();
  } else {
    gameState.accusedCharacter = gameState.selectedSuspect;
    m.textContent = GAME_DATA.ui.wrong; m.className = "final-message final-message--error";
    h.textContent = GAME_DATA.ui.hint; h.hidden = false;
  }
}

function showVictoryScreen(){
  $("#victory-title").textContent = GAME_DATA.ui.correct;
  $("#victory-image").src = GAME_DATA.final.victoryImage;
  $("#victory-text").textContent = GAME_DATA.ui.victory;
  $("#victory-explanation").textContent = GAME_DATA.ui.finalExplanation;
  $("#btn-victory-return").textContent = GAME_DATA.ui.returnToMap;
  showScreen("victory");
}

function handleAction(e){
  const el = e.target.closest("[data-action]");
  if (!el) return;
  switch (el.dataset.action){
    case "start": startGame(); break;
    case "go-map": goToMap(); break;
    case "open-location": openLocation(el.dataset.location); break;
    case "open-notebook": openNotebook(); break;
    case "close-notebook": closeNotebook(); break;
    case "ask": askQuestion(el.dataset.index); break;
    case "toggle-minigame": toggleMiniGame(); break;
    case "open-final": openFinalScreen(); break;
    case "select-suspect": selectSuspect(el.dataset.character); break;
    case "confirm-accusation": confirmAccusation(); break;
  }
}

function bindEvents(){
  document.addEventListener("click", handleAction);
  document.addEventListener("keydown", e => {
    if (e.key === "Enter" && e.target.classList.contains("q-input")){
      askQuestion(e.target.dataset.index);
    }
    if (e.key === "Escape" && !$("#overlay-notebook").hidden) closeNotebook();
  });
  $("#overlay-notebook").addEventListener("click", e => {
    if (e.target === $("#overlay-notebook")) closeNotebook();
  });
}

function initGame(){
  renderStaticLabels();
  renderStart();
  bindEvents();
  showScreen("start");
}

document.addEventListener("DOMContentLoaded", initGame);
</script>
</body>
</html>
